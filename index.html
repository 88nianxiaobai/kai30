 ['1｜通用陪练','Act as a friendly native-English classmate. Let\u2019s talk about <今天主题>. Ask me questions one at a time, keep your replies under 3 sentences, and let me speak 70% of the time. If I switch to Chinese, push me to say it in English.'],
 ['2｜5 轮追问','Now ask me 5 follow-up questions about what I just said, one at a time. Use natural, slightly challenging questions a classmate would ask.'],
 ['3｜只纠 3 个错','After each of my answers, correct only the 3 most important mistakes: one grammar, one word choice, one phrasing. Ignore small errors. Give me the corrected sentence.'],
 ['4｜快语速轰炸','From now on, speak fast, use long sentences and some accent, and don\u2019t slow down. Don\u2019t help me. Just keep talking like a busy professor. I\u2019ll try to keep up.'],
 ['5｜老师点名模拟','Act as a professor who suddenly calls on me: "Liu, what do you think about <话题>?" Then wait. After I answer, challenge me once with "Why?" and once with "Can you give an example?"'],
 ['6｜小组讨论模拟','Simulate a 4-person group discussion about <话题>. You play 3 different classmates (one agrees, one disagrees, one stays quiet). I must speak at least 3 times. Interrupt me sometimes.'],
 ['7｜复述质检','I just explained <话题> in 2 minutes. Now: (a) summarize what you understood, (b) tell me 2 points that were unclear, (c) ask me 3 questions to check if it made sense.']
];

const MATERIALS = [
 ['跟读语料 A','你自己写的 SAIC 开场稿（最熟，起步最容易）','SAIC_SsangYong_开场市场_10min_v2_中英对照.docx｜本地 media 目录'],
 ['跟读语料 B','BE 8 篇 Reading，按难度递进','media\\Reading_extracted\\Reading\\ 下 1–8'],
 ['W2 用','Reading 3 · Hofstede\u2019s cultural dimensions','第 9–11 天'],
 ['W3 用','Reading 6 · Intercultural Conflict','第 12–16 天'],
 ['W4 用','Reading 5 / 7 / 8 · Acquisition · Leadership · Teams','第 17–29 天'],
 ['案例口语弹药','SAIC 讲稿 + 中英对照 + PPT 问答稿','SAIC_SsangYong_30min_speech.docx｜SAIC_SsangYong_PPT_QnA.docx'],
 ['AI 陪练','豆包 App 语音通话（最像真人）／DeepSeek／通义','开语音，粘贴"句型/材料"页的提示词'],
 ['跟读音频','本机 edge-tts 可把你的材料做成"逐句＋留白"MP3','需要就找小刘生成'],
 ['免费备用语料','BBC 6 Minute English（带文本+音频）｜VOA Learning English｜TED-Ed','bbc.co.uk/learningenglish'],
 ['录音工具','手机自带录音 App','每天必录，这是唯一的进度尺'],
 ['打卡与卡壳','就在这个 App 的「今天」和「记录」页','不用另找工具']
];

const GROUPS = [
 ['① 提问',['Could you elaborate on that?','What do you mean by…?','How does that work in practice?','Can you give me an example?','What\u2019s the implication for…?']],
 ['② 给观点',['From my perspective…','I\u2019d argue that…','It seems to me that…','What strikes me is…','I tend to think…']],
 ['③ 同意 / 补充',['That\u2019s a good point.','I\u2019d add that…','Building on what you said…','Exactly, and…','I\u2019d go even further…']],
 ['④ 不同意',['I see it differently.','I\u2019m not sure I agree, because…','That may be true, but…','I\u2019d push back on that a little.','That\u2019s one way to look at it, but…']],
 ['⑤ 救场',['That\u2019s a good question — let me think for a second.','I\u2019m not sure I follow. Could you rephrase?','Sorry, I didn\u2019t catch that.','Could I come back to that?','How do you say… in English?']],
 ['⑥ 接话 / 收尾',['Let me put it another way.','To put it simply…','So what I\u2019m saying is…','That\u2019s my main point.','Anyway, that\u2019s my take — does that make sense?']]
];
const CHUNKS = ['you know','I mean','basically','actually','to be honest','the thing is','at the end of the day','more or less','kind of','in terms of','as far as I know','if I remember correctly','roughly speaking','that said','having said that','on top of that','the bottom line is','in other words','by and large','the way I see it'];
const SECTIONS = [
 ['影子跟读','25 分钟'],
 ['语块操练','20 分钟'],
 ['AI 语音对话','50 分钟'],
 ['录 1 分钟即兴','20 分钟'],
 ['卡壳清单','5 分钟']
];

/* ============ 状态 ============ */
const KEY='kai30';
let ST = JSON.parse(localStorage.getItem(KEY)||'null');
if(!ST) ST = {prog:{}, chunks:[], self:{}};
ST.prog = ST.prog||{}; ST.chunks = ST.chunks||[]; ST.self = ST.self||{};
function save(){ localStorage.setItem(KEY, JSON.stringify(ST)); }
function todayN(){
  const t=new Date(); t.setHours(0,0,0,0);
  const s=new Date(2026,8,14);
  const n=Math.floor((t-s)/86400000)+1;
  return Math.max(1, Math.min(30, n));
}
function isToday(n){
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(2026,8,14+(n-1));
  return t.getTime()===d.getTime();
}
function doneCount(n){ return (ST.prog[n]||[]).filter(Boolean).length; }
function isFull(n){ return doneCount(n)===5; }
function totalDays(){ let c=0; for(let i=1;i<=30;i++) if(isFull(i)) c++; return c; }
function totalTasks(){ let c=0; for(let i=1;i<=30;i++) c+=doneCount(i); return c; }

function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1500); }
function cp(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}

/* ============ 顶栏 ============ */
function head(){
  const n=todayN(), d=DAYS[n-1];
  document.getElementById('hdrSub').textContent = 'Day '+n+' / 30 · '+d.md+' '+d.wd+(n===1?' · 开始':'');
  document.getElementById('hdrBar').style.width = (totalTasks()/150*100)+'%';
  document.getElementById('hdrTxt').textContent = '已完成 '+totalDays()+' / 30 天';
}

/* ============ 今天 ============ */
function renderToday(){
  const n=todayN(), d=DAYS[n-1];
  const note = NOTES[n] ? '<div class="warn">'+NOTES[n]+'</div>' : '';
  const mins = d.min ? '保底版 60 分钟（今天只有 1 小时）' : '标准 120 分钟（可拆成早 60 + 晚 60）';
  let h = '<div class="day-hero"><div class="k">'+(isToday(n)?'今天':'第 '+n+' 天')+'</div><div class="n">Day '+n+'</div><div class="th">'+d.t+'</div></div>';
  h += note;
  h += '<div class="ok">'+mins+'</div>';
  const arr = ST.prog[n]||[];
  SECTIONS.forEach(function(s,i){
    const on = arr[i] ? ' done':'';
    let ds='';
    if(i===0) ds = '材料：'+d.sh+'｜顺序：盲听 1 遍 → 看稿跟 3 遍 → 脱稿跟 2 遍';
    if(i===1) ds = d.ch.map(function(c){return '<span class="chip">'+c+'</span>';}).join('');
    if(i===2) ds = '提示词 '+d.pr+'（去「材料」页复制）｜主题：'+d.t+'｜先自己说 2 分钟 → AI 追问 5 轮';
    if(i===3) ds = '产出：'+d.out;
    if(i===4) ds = '写下今天卡住的 3 个"想说但说不出"，明天第 2 段复练';
    h += '<div class="task'+on+'" data-i="'+i+'"><div class="chk">'+(arr[i]?'✓':'')+'</div><div class="bd">'+
         '<div class="tt"><span>'+s[0]+'</span><s>'+s[1]+'</s></div>'+
         '<div class="ds">'+(i===1?'<div class="chips">'+ds+'</div>':ds)+'</div></div></div>';
  });
  h += '<div class="card"><h3>📌 今天完成后</h3><div class="mini">点上面 5 个方块打勾。全部打勾 = 这一天完成。<br>先去「记录」页写下卡壳的 3 条，再收工。</div></div>';
  const box=document.getElementById('todayBox'); box.innerHTML=h;
  box.querySelectorAll('.task').forEach(function(el){
    el.onclick=function(){
      const i=+el.dataset.i; if(!ST.prog[n]) ST.prog[n]=[false,false,false,false,false];
      ST.prog[n][i]=!ST.prog[n][i]; save(); renderAll();
      if(isFull(n)) toast('👏 Day '+n+' 完成！');
    };
  });
}

/* ============ 日历 ============ */
function renderCal(){
  document.getElementById('s1').textContent=totalDays();
  document.getElementById('s2').textContent=totalTasks();
  document.getElementById('s3').textContent=ST.chunks.length;
  let h='', wk=0;
  DAYS.forEach(function(d){
    const w = d.d<=7?1:(d.d<=14?2:(d.d<=21?3:4));
    if(w!==wk){ wk=w; h+='<div class="wk">第 '+w+' 周 · '+(w===1?'解锁嘴巴（自我相关）':w===2?'搭骨架（2 分钟专业独白）':w===3?'进课堂（提问与讨论）':'抗压（听不懂也不崩）')+'</div>'; }
    const c=doneCount(d.d);
    let cls = c===5?'full':(c>0?'part':'');
    if(isToday(d.d)) cls+=' today';
    h+='<div class="cd '+cls+'" data-d="'+d.d+'" title="'+d.t+'"><div class="dn">'+d.d+'</div><div class="dt">'+d.md+'</div></div>';
  });
  const box=document.getElementById('calBox'); box.innerHTML=h;
  box.querySelectorAll('.cd').forEach(function(el){ el.onclick=function(){ openDay(+el.dataset.d); }; });
  document.querySelectorAll('.cd').forEach(function(el){ el.title=DAYS[+el.dataset.d-1].t; });
}

/* ============ 单日详情 ============ */
function openDay(n){
  const d=DAYS[n-1];
  const note = NOTES[n] ? '<div class="warn">'+NOTES[n]+'</div>':'';
  let h='<div class="back" id="bk">‹ 返回</div>';
  h+='<div class="day-hero"><div class="k">'+(isToday(n)?'今天':'第 '+n+' 天')+'</div><div class="n">Day '+n+'</div><div class="th">'+d.t+'</div><div class="k" style="margin-top:5px">'+d.md+' '+d.wd+'</div></div>';
  h+=note;
  h+='<div class="card"><h3>🎯 当天产出</h3><div class="mini">'+d.out+'</div></div>';
  h+='<div class="card"><h3>🔊 影子跟读 25′</h3><div class="mini">'+d.sh+'<br>盲听 1 遍 → 看稿跟 3 遍 → 脱稿跟 2 遍（每句一停）</div></div>';
  h+='<div class="card"><h3>🧱 语块操练 20′ <em>8 个</em></h3><div class="chips">'+d.ch.map(function(c){return '<span class="chip">'+c+'</span>';}).join('')+'</div><div class="mini" style="margin-top:8px">每个语块用你自己的工作和内容造 3 句，大声说出来。</div></div>';
  h+='<div class="card"><h3>💬 AI 语音对话 50′</h3><div class="mini">用提示词 <b>'+d.pr+'</b>（「材料」页可一键复制）<br>主题：'+d.t+'<br>先自己说 2 分钟独白 → 再让 AI 追问 5 轮</div></div>';
  h+='<div class="card"><h3>🎙️ 录 1 分钟即兴 20′</h3><div class="mini">不准备，直接说 60 秒，录音存档。</div></div>';
  h+='<div class="card"><h3>📝 卡壳清单 5′</h3><div class="mini">去「记录」页写 3 条。</div></div>';
  document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('on'); });
  document.getElementById('p-detail').classList.add('on');
  document.getElementById('detailBox').innerHTML=h;
  document.getElementById('bk').onclick=function(){
    document.getElementById('p-detail').classList.remove('on');
    document.getElementById('p-today').classList.add('on'); renderAll();
  };
}

/* ============ 材料 ============ */
function renderMat(){
  let h='<div class="card"><h3>📚 你要用的材料 <em>零采购</em></h3>';
  MATERIALS.forEach(function(m){
    h+='<div class="mi"><div><div>'+m[0]+'</div><div class="mp">'+m[1]+'</div><div class="mp">'+m[2]+'</div></div></div>';
  });
  h+='</div>';
  h+='<div class="card"><h3>🤖 7 个 AI 陪练提示词</h3><div class="mini">点"复制"粘进豆包／DeepSeek。把 &lt;今天主题&gt; 换成当天的主题即可。</div></div>';
  PROMPTS.forEach(function(p){
    h+='<div class="pm"><div class="pt"><span>'+p[0]+'</span><button class="bt" data-c="'+encodeURIComponent(p[1])+'">复制</button></div><pre>'+p[1]+'</pre></div>';
  });
  h+='<div class="warn">第 4 天（快语速轰炸）和第五周的抗压练习，是专门练"听不懂也不崩"的——这是你真正的痛点。</div>';
  const box=document.getElementById('p-mat'); box.innerHTML=h;
  box.querySelectorAll('[data-c]').forEach(function(b){ b.onclick=function(){ cp(decodeURIComponent(b.dataset.c)); }; });
}

/* ============ 句型 ============ */
function renderPt(){
  let h='<div class="card"><h3>💬 30 个课堂句型</h3><div class="mini">分 6 组，每天轮 8 个。卡壳了就翻这里。</div></div>';
  GROUPS.forEach(function(g){
    h+='<div class="sg"><div class="st">'+g[0]+'</div>';
    g[1].forEach(function(s){ h+='<div class="en"><span>'+s+'</span><button class="bt" data-c="'+encodeURIComponent(s)+'">复制</button></div>'; });
    h+='</div>';
  });
  h+='<div class="card"><h3>🔗 20 个口语黏合剂</h3><div class="mini">说完短句后接一个，断续就变连贯。这 20 个比 200 个单词有用。</div><div class="chips" style="margin-top:9px">'+CHUNKS.map(function(c){return '<span class="chip">'+c+'</span>';}).join('')+'</div></div>';
  const box=document.getElementById('p-pt'); box.innerHTML=h;
  box.querySelectorAll('[data-c]').forEach(function(b){ b.onclick=function(){ cp(decodeURIComponent(b.dataset.c)); }; });
}

/* ============ 记录 ============ */
function renderRec(){
  const n=todayN();
  let h='<div class="card"><h3>📝 卡壳清单 <em>'+ST.chunks.length+' 条</em></h3>';
  h+='<div class="mini">记"我想说但说不出来"的中文，配上正确英文。30 天会收敛到 30 条以内——那 30 条就是你真缺的全部。</div>';
  h+='<div class="inp" style="margin-top:10px"><input id="cZh" placeholder="我想说的中文（如：我们负责数据分级）"><input id="cEn" placeholder="英文说法" style="max-width:36%"></div>';
  h+='<button class="bt" id="cAdd" style="width:100%;padding:10px;font-size:13px">＋ 记一条</button>';
  h+='</div>';
  if(ST.chunks.length){
    const list=ST.chunks.slice().reverse();
    h+='<div class="card"><h3>已记录</h3>';
    list.forEach(function(c,i){
      h+='<div class="rec"><div class="rl">'+c.date+'</div><div>'+c.zh+'</div><div class="re">'+c.en+'</div></div>';
    });
    h+='</div>';
  }
  const d=DAYS[n-1];
  h+='<div class="card"><h3>⭐ 今天的录音自评 <em>1–5 分</em></h3><div class="mini">① 流利度（卡壳次数）② 结构（有没有 Point→Reason→Example→So what）③ 词汇缺口（卡壳新增几条）④ 救场（用没用上救场句）</div>';
  h+='<div id="selfBox"></div></div>';
  const box=document.getElementById('p-rec'); box.innerHTML=h;
  document.getElementById('cAdd').onclick=function(){
    const zh=document.getElementById('cZh').value.trim(), en=document.getElementById('cEn').value.trim();
    if(!zh){ toast('先写中文'); return; }
    const dd=new Date();
    ST.chunks.push({zh:zh, en:en||'（待补）', date:(dd.getMonth()+1)+'/'+dd.getDate()});
    save(); renderAll(); toast('已记录');
  };
  let sh='';
  for(let i=1;i<=4;i++){
    const v=ST.self[n+'_'+i]||0;
    sh+='<div class="mi" style="justify-content:flex-start;gap:10px"><span style="flex:1;font-size:12.5px">'+['流利度','结构','词汇缺口','救场'][i-1]+'</span>';
    for(let k=1;k<=5;k++) sh+='<span class="bt" data-s="'+i+'-'+k+'" style="'+(v===k?'background:#1f6feb;color:#fff':'')+'">'+k+'</span>';
    sh+='</div>';
  }
  document.getElementById('selfBox').innerHTML=sh;
  document.querySelectorAll('[data-s]').forEach(function(b){
    b.onclick=function(){ const a=b.dataset.s.split('-'); ST.self[n+'_'+a[0]]=+a[1]; save(); renderRec(); };
  });
}

/* ============ 启动 ============ */
function renderAll(){ head(); renderToday(); renderCal(); renderRec(); }
renderMat(); renderPt();
renderAll();

document.querySelectorAll('nav a').forEach(function(a){
  a.onclick=function(){
    document.querySelectorAll('nav a').forEach(function(x){ x.classList.remove('on'); });
    a.classList.add('on');
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('on'); });
    document.getElementById('p-'+a.dataset.t).classList.add('on');
    document.getElementById('main').scrollTop=0;
    if(a.dataset.t==='cal') renderCal();
    if(a.dataset.t==='rec') renderRec();
  };
});
</script>
