h side actually want from this deal?", "SAIC had three objectives.", "First, to acquire SsangYong's advanced diesel engine and SUV technologies, so it could adapt them for the Chinese market.", "Second, to enhance its own international brand credibility and to learn how to manage a foreign subsidiary.", "Third, to use SsangYong's distribution channels to push into overseas markets — especially Southeast Asia and the Middle East."], "3": ["Now, SsangYong's expectations were different.", "It wanted long-term investment and financial stability.", "It wanted to strengthen its R&D through Chinese capital.", "And it wanted access to the huge Chinese consumer market through SAIC's networks.", "On the surface, these goals look entirely complementary.", "One side brings capital and market access; the other side brings technology.", "That's exactly why the deal was promoted as a strategic partnership for mutual growth, and why 'win-win' was the slogan on the calligraphy gift presented at the signing.", "But here is the cultural trap.", "The two sides had different timelines, and different measures of success, from the very first day.", "Let me frame this with Hofstede's Long-Term Orientation dimension.", "SsangYong was focused on the long term — job security, brand recovery, a sustainable future.", "It was building for the long term.", "SAIC, by contrast, was focused on the short term — diesel technology, platform reuse, knowledge transfer — to accelerate its own domestic growth.", "It was extracting for the short term."], "4": ["Same deal, two completely different clocks.", "One side was building for the future; the other was extracting value for the present.", "That one difference caused every conflict that followed.", "Now, let's peel this with the Onion Model, because the market misalignment was not really about the numbers.", "It was about two different assumptions about what a partnership even is.", "On the surface, this looked like a negotiation over terms.", "But underneath, at the level of basic assumptions, the two sides read 'partnership' completely differently.", "For SAIC, the assumption was: we are the larger, stronger player; we acquire, we control, we extract value.", "For SsangYong, the assumption was: we are entering a marriage of equals; we contribute technology, and we expect to be respected and protected.", "That mismatch of core assumptions — not the negotiation itself — is what made the market alignment fragile from day one.", "Because if one side treats a partnership as a takeover, and the other treats it as a partnership, then every single subsequent decision gets read in two different ways."], "5": ["And that is precisely what we see.", "After the acquisition, SAIC wanted rapid knowledge transfer.", "The Koreans, mindful of protecting their technology and their autonomy, moved slowly.", "What looked to SAIC like an unreasonable delay was, from the Korean side, a reasonable safeguard of a partnership they believed they had entered.", "Neither side was being 'unreasonable.", "Both were acting perfectly rationally — but according to two different cultural logics.", "That is the market dimension seen through the lens of culture.", "Let me close the market section with a short summary.", "What does the market analysis really tell us?", "The market did not kill this deal — the numbers were never the real problem.", "What killed it was a clash of three things.", "First, incompatible definitions of success: the same deal, but one side measured it in long-term stability and the other in short-term extraction.", "Second, a mismatch of time horizons, which we captured with Hofstede's Long-Term Orientation.", "And third — and this is the deepest layer — two different core assumptions about what a partnership is, which we peeled out with the Onion Model: one side saw a marriage of equals, the other saw a takeover."], "6": ["In short: these were not economic problems.", "They were cultural problems wearing economic clothing.", "And that is my takeaway for the market dimension.", "Now, the market was where the deal looked good but was already fragile.", "But it didn't stay at the level of expectations — it escalated.", "And that escalation happened through the legal and structural dimension, where the clash became impossible to contain.", "Let me hand over to my colleague, who will walk you through the legal dimension — the control structure and the labor union. Thank you."], "7": ["Good morning, everyone.", "Today, our group is going to analyze a classic cross-cultural failure: the 2004 acquisition of SsangYong Motor by SAIC.", "Before we begin, let me state our central argument clearly — because it is the thread that runs through everything we will say today.", "SAIC did not lose this acquisition because it failed to understand technology.", "It lost it because it failed to understand culture.", "The deal made perfect sense on paper.", "It collapsed in practice.", "As a group, we will analyze this case from three dimensions.", "I will focus on the market.", "Zhang Shiyuan will analyze the legal dimension, and Han Wei will analyze the management dimension.", "Each of us will also wrap up our own section with a short summary.", "So let me start with the market — but first, a very quick setup.", "I won't spend time on the background, because the earlier group has already set the scene.", "In short: SsangYong, Korea's oldest SUV manufacturer, was financially weak and looking for a global partner.", "SAIC, China's largest state-owned automaker, wanted foreign technology, brand credibility, and international management experience.", "In October 2004, SAIC acquired 48.9% of SsangYong's equity — but with management control equivalent to 51% of voting rights."], "8": ["Geert Hofstede is a social psychologist who has conducted extensive research on cultural behaviors and norms.", "Through that research, he and others have identified six dimensions that they argue affect the ways people from various cultures interact.", "The dimensions are identified and explained below.", "It is important to bear in mind that these dimensions are generalizations only and may not be applicable to everyone from a particular culture.", "However, learning about the common ways a person from a particular society might behave can be helpful in providing potential explanations of cultural misunderstandings.", "(1) (Intercultural tips: people tend to misunderstand or misuse Hofstede's research, claiming that Hofstede's country scores can help people understand those countries, but his dimensions can only help people understand the cultural differences among different countries.", "This is the way people in a society relate to each other on a hierarchical scale.", "A culture that gives great deference to a person of authority is a High Power Distance culture, and a culture that values the equal treatment of everyone is a Low Power Distance culture.", "In High Power Distance cultures, \"inequality is seen as the basis of societal order\".", "Low Power Distance cultures, on the other hand, see inequality as sometimes necessary (think professor to student), but the more that relationships can be equalized, the better for everyone.", "(This dimension displays how a culture handles inequality, particularly in relation to power.", "In high power distance cultures, inequality and hierarchal statuses are a way of life.", "Low power distance cultures move in the other direction; they place a high value on the equal distribution of societal power."], "9": ["If only a few maintain all the power and wealth, it's viewed as unfair.", "This dimension reflects the degree to which a culture embraces the uncertainty of the future.", "(It is natural for people to avoid uncertain situations, so our cultural perceptions and expectations would seek to avoid these situations.", "Any situation that does not fit within one's perception of what is normal will create a degree of uncertainty.", "A British person may feel uncomfortable singing karaoke in front of a hundred teachers at a party, as a Japanese high school student might find it equally uncomfortable asking her teacher a question in front of the whole class.", "Hofstede argues that since uncertainty can create anxiety, all societies have found coping mechanisms to deal with that anxiety.", "These coping mechanisms tend to fall into three categories: technology, law, and religion.", "Those cultures which have a high level of uncertainty avoidance tend to rely very strongly on their set rules and ways of doing things.", "It may be seen as an attempt to control as much of the uncertainty as possible.", "(An example of an item in the research tool to assess this dimension is, \"Company rules should not be broken — even when the employee thinks it is in the company's best interests\".", "Those societies with a lower level of anxiety for the future (low uncertainty avoidance) may be more relaxed about the how things are done."], "10": ["This dimension identifies the ways in which people of a society relate to each other, in living arrangements, decision making processes and values.", "Some societies, such as the U.S., strongly value the individual.", "We value making our own personal choices about what we study, what we say, what religion we practice, and how we choose to live.", "This does not mean that family and communities are not important, but we are personally responsible to make decisions for ourselves that we believe best meet our own needs.", "There are other cultures that put much more emphasis on the group.", "The decisions one makes are made with the group in mind.", "What major you take in college may be taken because it is something that is needed in your country, for instance.", "In some of those cultures, shame is a concept that is learned from childhood and drives behavioral traits within the individual.", "\"Any Asians will do everything in their power not to show any negative emotions or feelings for fear of going against the cultural norm of collectivism.", "Anger, disappointment, sadness, and issues related to shame such as poor grades, relational difficulties, bankruptcy, sexual issues, and addictions remain hidden in secrecy and shame\".", "(This dimension focuses on the unification of culture.", "In individualistic cultures, the population is less tightly-knit, and there is an \"every man for himself\" mentality.", "People are expected to take care of themselves and their immediate family first.", "In collectivist cultures, importance is placed on the concept of \"we\" instead of \"I\", with closely connected groups within that population working together."], "11": ["Benefits for the group as a whole is the main focus, while benefits for the self stem from the group mentality.", "This dimension looks at the extent to which a culture supports a traditional view of masculine and feminine traits.", "For these purposes, masculinity refers to traits associated with assertiveness and femininity refers to traits associated with nurture.", "In Hofstede's words, \"In a strict sense, only behaviors directly connected with procreation (childbearing and child begetting) are 'feminine' or 'masculine.", "Yet every society recognizes many other behaviors as more suitable to females or more suitable to males; these represent relatively arbitrary choices, medicated by cultural norms and traditions\".", "(In this dimension, a culture is measured on a scale of masculinity vs. femininity, which represents a culture's preferences for achievement, competition, and materialism vs. preferences for teamwork, harmony, and empathy.", "This dimension focuses on whether a culture measures personal achievement through competitive success and the need to be the best, or through caring for others and finding value in personal quality of life, doing what makes one happiest.)"], "12": ["As Hofstede developed his research, he came to the conclusion that his work was limited by the lack of inclusion of non-Western researchers.", "As a result, he began working with the Chinese Value Survey (DVS), an instrument developed by Michael Harris Bond in Hong Kong.", "Hofstede offers this definition: \"Long Term Orientation stands for the fostering of virtues oriented towards future rewards, in particular, perseverance and thrift.", "Its opposite pole Short Term Orientation, stands for the fostering of virtues related to the past and present, in particular, respect for tradition, preservation of 'face,' and fulfilling social obligations\".", "(Long-term orientated cultures will plan for the future, while short-term orientated cultures are likely to focus on short-term gains in life.", "In a business sense, long-term vs. short-term orientation can also play into how that business measures succeed.", "Short-term is putting an importance on success during a quarterly basis, with quick results being rewarded.", "In long-term cultures, business is about patience and playing the long game, avoiding short-term gains that lead to long-term losses.)"], "13": ["The final dimension was added in 2010 in order to capture more recent research conducted around themes of happiness.", "This dimension was based in part on research conducted by Michael Minkov, a Bulgarian sociologist and creator of the extensive World Values Survey.", "An indulgent society is one which values the satisfaction of human needs and desires; a restrained society sees the value in curbing ones' desires and withholding pleasures to align more with societal norms.", "\"Indulgent cultures will tend to focus more on individual happiness and well-being, leisure time is more important, and there is greater freedom and personal control.", "This is in contrast with restrained cultures where positive emotions are less freely expressed and happiness, freedom, and leisure are not given the same importance\".", "(All cultures acknowledge that the natural human response in life is the urgent need to gratify desires.", "However, each culture will answer this need by either enjoying (indulgence) or controlling (restraint) those impulses.", "In restrained cultures, the general attitude moves towards pessimism, as stricter morals and social rules are enforced on people.", "This contrasts with indulgent cultures, which is prone to be more carefree, encouraging people to enjoy leisure time and take advantage of opportunities to gratify their impulses.)"], "14": ["Geert Hofstede is a social psychologist who has conducted extensive research on cultural behaviors and norms.", "Through that research, he and others have identified six dimensions that they argue affect the ways people from various cultures interact.", "The dimensions are identified and explained below.", "It is important to bear in mind that these dimensions are generalizations only and may not be applicable to everyone from a particular culture.", "However, learning about the common ways a person from a particular society might behave can be helpful in providing potential explanations of cultural misunderstandings.", "(1) (Intercultural tips: people tend to misunderstand or misuse Hofstede's research, claiming that Hofstede's country scores can help people understand those countries, but his dimensions can only help people understand the cultural differences among different countries.", "This is the way people in a society relate to each other on a hierarchical scale.", "A culture that gives great deference to a person of authority is a High Power Distance culture, and a culture that values the equal treatment of everyone is a Low Power Distance culture.", "In High Power Distance cultures, \"inequality is seen as the basis of societal order\".", "Low Power Distance cultures, on the other hand, see inequality as sometimes necessary (think professor to student), but the more that relationships can be equalized, the better for everyone.", "(This dimension displays how a culture handles inequality, particularly in relation to power.", "In high power distance cultures, inequality and hierarchal statuses are a way of life.", "Low power distance cultures move in the other direction; they place a high value on the equal distribution of societal power."], "15": ["A key question is this: Is conflict good or bad?", "That is, should conflict be welcomed because it provides opportunities to strengthen relationships?", "Or should it be avoided because it can only lead to problems for relationships and groups?", "Another key question is this: What is the best way to handle conflict when it arises?", "Should individuals talk about it directly, deal with it indirectly, or avoid it?", "It's not always easy to figure out the best way to deal with conflict.", "And what do cultures have to do with conflict?", "Your cultural background may influence how you answer these questions.", "Some cultural groups think conflict is ultimately good, and others think that it is fundamentally destructive.", "Let's look at these two approaches.", "In many cultures, especially Western cultures, conflict is viewed as fundamentally a good thing.", "That is, working through conflicts constructively results in stronger, healthier, and more satisfying relationships.", "Similarly, groups that work through conflict can gain new information about members or about other groups, defuse more serious conflict, and increase group cohesiveness.（1）"], "16": ["According to this viewpoint, individuals should be encouraged to think of creative, even far-reaching solution to conflicts.", "There is also value in direct confrontation, recognizing conflict and working through it in an open, productive way.", "In fact, many people consider conflict-free relationships to be less than healthy and potentially problematic.", "In this view, conflict presents opportunities to clarify issues in relationships, release tensions, and renew relationships.", "However, many cultural groups view conflict as ultimately destructive for relationships.", "For example, many Asian cultures, reflecting the influence of Confucianism and Taoism, and some religious groups in the United States see conflict as disturbing the peace. （2） For instance, most Amish think of conflict not as an opportunity for personal growth, but as a threat to interpersonal and community harmony.", "When conflict does arise, the strong spiritual value of pacifism dictates a nonresistant response- often avoidance.", "Also, these groups think that when members disagree they should adhere to the consensus of the group rather than engage in conflict.", "In fact, members who threaten group harmony may be sanctioned.", "One writer gives an example of a man from the Maori culture in New Zealand who was swearing and using inappropriate language in a public meeting:"], "17": ["A woman went up to him, laying her hand on his arm and speaking softly.", "He shook her off and continued.", "The crowd now moved back, from him as far as possible and as if by general agreement, the listeners dropped their gaze to their toes until all he could see were the tops of their heads.", "The speaker slowed, faltered, was reduced to silence, and then sat down.", "In cultures like these, silence and avoidance may be used to manage conflict.", "For example, the Amish would prefer to lose face or money rather than escalate a conflict, and Amish children are instructed to turn the other cheek in any conflict situation, even if it means getting beaten up by the neighborhood bully.（3）Similarly, cultural groups influenced by Buddhist, Taoist, Confucian, and Shinto tradition also tend to avoid direct expression of feelings and verbal aggression.", "(The importance of silence as a communication tool and the interpretation of silence vary from culture to culture.", "In low-context cultures in which ideas are encoded explicitly into words, silence often is interpreted as the absence of communication.", "However, high-context cultures have a different attitude toward the use of silence.", "Perhaps the most obvious example is Japan, although other Asian countries share the Japanese attitude about silence."], "18": ["Individuals from these groups also use intermediaries- friends or colleagues who act on their behalf in dealing with conflict.", "People who think that interpersonal conflict provides opportunities to strengthen relationships also use mediation, but mainly in formal settings.（4） For instance, people retain lawyers to mediate disputes, hire real estate agents to negotiate commercial transactions, and engage counselors or therapists to resolve or manage interpersonal conflicts.", "What are the basic principles of nonviolence applied to interpersonal relations?", "Actually, nonviolence is not the absence of conflict, and it is not a simple refusal to fight.", "Rather, it involves peacemaking--a difficult, and sometimes very risky, approach to interpersonal relationships.", "Individuals who take the peacemaking approach strongly value the other person and encourage his or her growth, attempt to de-escalate conflicts or keep them from escalating once they start, and attempt to find creative negotiation to resolve conflicts when they arise.", "These two approaches to conflict resolution reflect different underlying cultural values involving identity and face saving.", "In the more individualistic approach that sees conflict as good, the concern is with individuals preserving their own dignity.", "The more communal approach espoused by both Amish and Asian cultures and by other collectivist groups is more concerned with maintaining harmony in interpersonal relationships and preserving the dignity of others.", "For example, in classic Chinese thought, social harmony is the goal of human society at all levels -----individual, family, village, and nation. (763 words)"], "19": ["Cultures influence communication styles.", "Although this point may seem obvious, cultural styles can and do create misunderstandings in conversations among people from different cultures.", "For example, consider the following conversation between an Italian and an American.", "The Italian made a strong political statement with which he knew his American friends would disagree.", "The Italian wanted to involve the American in a lively discussion.", "The American, rather than openly disagreeing, said, “Well, everyone is entitled to an opinion.", "I accept that your opinion is different from mine.", "The Italian responded, “That is all you have to say about it?", "In general, the American didn’t enjoy verbal conflicts over politics or anything else.", "The Italian actually became angry when the American refused to get involved in the discussion.", "He later explained to the American, “A conversation is not fun unless it becomes heated!", "(1) What does this example say about culture and its influence on communication?", "Surely, there are many Americans who do get involved in verbal conflicts over politics, just as there are some Italians who would not become involved.", "However, the above conversation represents types of communication patterns that are related to cultural differences."], "20": ["Cultural beliefs differ as to whether directness or indirectness is considered positive(2).", "In the mainstream American culture, the ideal form of communication includes being direct rather than indirect.", "There are several expressions in English that emphasize the importance of being direct: “Get to the point!", "Do not beat around the bush!", "Let’s get down to business!", "These sayings all indicate the importance of dealing directly with issues rather than avoiding them.", "One way to determine whether a culture favors a direct or indirect style in communication is to find out how the people in that culture express disagreement or how they say, “No”.", "In Japan, there are at least fifteen ways of saying, “No,” without actually saying the word.", "Similarly, in Japan, it would be considered rude to say directly, “I disagree with you,” or “You’re wrong”.", "Many Americans believed that “honesty is the best policy,” and their communication style reflects this.", "Honesty and directness in communication are strongly related.", "It is not a surprise, then, to find out that cultural groups misjudge each other based on different beliefs about directness and honesty in communication (3)."], "21": ["A key question is this: Is conflict good or bad?", "That is, should conflict be welcomed because it provides opportunities to strengthen relationships?", "Or should it be avoided because it can only lead to problems for relationships and groups?", "Another key question is this: What is the best way to handle conflict when it arises?", "Should individuals talk about it directly, deal with it indirectly, or avoid it?", "It's not always easy to figure out the best way to deal with conflict.", "And what do cultures have to do with conflict?", "Your cultural background may influence how you answer these questions.", "Some cultural groups think conflict is ultimately good, and others think that it is fundamentally destructive.", "Let's look at these two approaches.", "In many cultures, especially Western cultures, conflict is viewed as fundamentally a good thing.", "That is, working through conflicts constructively results in stronger, healthier, and more satisfying relationships.", "Similarly, groups that work through conflict can gain new information about members or about other groups, defuse more serious conflict, and increase group cohesiveness.（1）"], "22": ["Teams whose members come from different nations and backgrounds place special demands on managers especially when a feuding team looks to the boss for help with a conflict.", "When a major international software developer needed to produce a new product, the project manager assembled a team of employees from India and the United States.", "From the start the team members could not agree on a delivery date for the product.", "Americans thought the work could be done in two to three weeks; the Indians predicted it would take two to three months.", "As time went on, the Indian team members proved reluctant to report setbacks in the production process, which the American team members would find out about only when work was due to be passed to them.", "Such conflicts, of course, may affect any team, but in this case they arose from cultural differences.", "As tensions mounted, conflict over delivery dates and feedback became personal, disrupting team members’ communication about even mundane issues.", "The project manager decided he had to intervene - with the result that both the American and the Indian team members came to rely on him for direction regarding minute operational details that the team should have been able to handle itself.", "The manager became so bogged down by quotidian issues that the project careened hopelessly off even the most pessimistic schedule and the team never learned to work together effectively."], "23": ["Multicultural teams often generate frustrating management dilemmas.", "Cultural differences can create substantial obstacles to effective teamwork--but these may be subtle and difficult to recognize until significant damage has already been done.", "As in the case above, which the manager involved told us about, managers may create more problems than they resolve by intervening.", "The challenge in managing multicultural teams effectively is to recognize underlying cultural causes of conflict, and to intervene in ways that both get the team back on track and empower its members to deal with future challenges themselves.", "People tend to assume that challenges on multicultural teams arise from differing styles of communication.", "But this is only one of the four categories that, according to our research can create barriers to a team’s ultimate success.", "These categories are direct versus indirect communication; trouble with accents and fluency; differing attitudes toward hierarchy and authority; and conflicting norms for decision making.", "Direct versus indirect communication.", "Communication in Western cultures is typically direct and explicit.", "The meaning is on the surface and a listener doesn't have to know much about the context or the speaker to interpret it.", "This is not true in many other cultures, where meaning is embedded in the way the message is presented."], "24": ["For example, Western negotiators get crucial information about the other party's preferences and priorities by asking direct questions, such as \"Do you prefer option A or option B?", "In cultures that use indirect communication, negotiators may have to infer preferences and priorities from changes or the lack of them in the other party's settlement proposal in cross-cultural negotiations, the non-Westerner can understand the direct communications of the Westerner, but the Westerner has difficulty understanding the indirect communications of the non-Westerner.", "An American manager who was leading a project to build an interface for a U.S. and Japanese customer-data system explained the problems her team was having this way: “In Japan, they want to talk and discuss.", "Then we take a break and they talk within the organization.", "They want to make sure that there’s harmony in the rest of the organization.", "One of the hardest lessons for me was when I thought they were saying yes but they just meant ‘I’m listening to you.’” The differences between direct and indirect communication can cause serious damage to relationships when team projects run into problems.", "When the American manager quoted above discovered that several ﬂaws in the system would signiﬁcantly disrupt company operations, she pointed this out in an e-mail to her American boss and the Japanese team members.", "Her boss appreciated the direct warnings; her Japanese colleagues were embarrassed, because she had violated their norms for uncovering and discussing problems.", "Their reaction was to provide her with less access to the people and information she needed to monitor progress.", "They would probably have responded better if she had pointed out the problems indirectly – for example, by asking them what would happen if a certain part of the system was not functioning properly, even though she knew full well that it was malfunctioning and also what the implications were."], "25": ["With the acceleration of global economic integration and China’s “Going Global” strategy, an increasing number of Chinese enterprises have expanded outbound investment and overseas layout.", "From infrastructure construction and manufacturing to digital technology and modern services, Chinese multinational enterprises have become important participants in global industrial cooperation.", "However, cross-cultural differences, institutional gaps, and diversified local market demands have become core obstacles restricting the sustainable development of Chinese overseas enterprises.", "In this context, building a glocal mindset and cultivating professional intercultural leadership have become essential capabilities for Chinese outbound investment enterprises to resolve cultural conflicts, achieve localized operation, and gain global competitive advantages.", "This paper explores the connotation, practical value and cultivation strategies of glocal mindset and intercultural leadership for Chinese overseas enterprises.", "Glocal mindset, a combination of “global” and “local”, is the core cognitive foundation of modern international business operation.", "Different from the single global thinking that emphasizes unified global standards or pure local thinking that focuses only on regional adaptation, glocal mindset stresses global strategic positioning plus localized flexible adaptation.", "According to the theoretical framework of global mindset, it integrates intellectual capital of global business cognition, psychological capital of inclusive cultural awareness, and social capital of cross-cultural communication and coordination.", "For Chinese outbound investment enterprises, glocal mindset means adhering to the overall global development strategy of the enterprise while fully respecting the local cultural traditions, institutional norms, consumption habits and employment concepts of host countries.", "It abandons the simplistic expansion model of copying domestic management models overseas, and realizes organic integration of global resource allocation and local market embedding."], "26": ["Intercultural leadership is the practical capability derived from glocal mindset, referring to the ability of enterprise leaders to coordinate multicultural teams, resolve cultural conflicts, and drive localized business development in cross-border operating environments.", "Excellent intercultural leadership covers three core dimensions: cultural intelligence, inclusive communication and flexible decision-making.", "Cultural intelligence enables leaders to accurately identify cultural differences in values, work styles and communication modes between Chinese and local employees.", "Inclusive communication focuses on equal dialogue and mutual respect to eliminate cultural prejudice and information asymmetry.", "Flexible decision-making requires leaders to adjust management strategies and operational logic according to local institutional and cultural characteristics, balancing corporate global norms and local operational flexibility.", "For Chinese overseas enterprises, intercultural leadership is no longer a personal quality of leaders, but a core organizational capability supporting long-term overseas operation.", "At present, most Chinese outbound investment enterprises face prominent cultural and leadership dilemmas in overseas operations.", "In the initial stage of international expansion, many Chinese enterprises rely heavily on expatriate management teams, and tend to copy domestic hierarchical management models and efficient execution mechanisms to overseas branches.", "This management model adapted to China’s corporate culture often conflicts with the local emphasis on individual independence, procedural standardization and autonomous office culture, leading to low team collaboration efficiency and poor employee cohesion.", "In addition, cultural differences in business ethics and social responsibility also bring operational risks.", "Some enterprises focus only on project profit and scale expansion, ignoring local community demands and cultural customs, which easily triggers local public misunderstanding and resistance, hindering the sustainable development of investment projects."], "27": ["The lack of systematic intercultural leadership further amplifies operational risks.", "Many overseas managers of Chinese enterprises have professional business capabilities but lack cross-cultural communication and conflict resolution capabilities.", "They often fail to accurately grasp local cultural taboos and business etiquette, resulting in communication misunderstandings with local employees, customers and government departments.", "Meanwhile, insufficient local talent localization and single leadership structure make it difficult for enterprises to integrate into local industrial and ecological environments.", "Different from Western multinational enterprises with mature cross-cultural management systems, most Chinese outbound enterprises are in the exploratory stage of cross-cultural operation, and have not formed a standardized intercultural leadership training and management system, restricting their global competitiveness improvement.", "To break through cross-cultural operational dilemmas, Chinese outbound investment enterprises must take glocal mindset as the guide to build systematic intercultural leadership capabilities.", "First, enterprises should reshape their strategic cognition and establish a glocal development concept.", "Enterprises need to abandon the traditional “scale-oriented” oversea  let h='<div class="warn">每天要跟读的那一段，都已经按天切好放在这里。点进去就能看原文、逐句跟。</div>';
 h+='<div class="card"><h3>📅 按天跟读 <em>30 段</em></h3>';
 for(let n=1;n<=30;n++){const d=DAYS[n-1];const ss=daySeg(n);
  h+='<div class="mrow" data-sh="'+n+'"><div><div class="mt">Day '+n+' · '+E(d.t)+'</div><div class="ms">'+E(matOf(d.mat).t)+' · 第 '+d.seg+' 段 · '+ss.length+' 句</div></div><span class="arw">›</span></div>';}
 h+='</div>';
 h+='<div class="card"><h3>📚 材料全文 <em>点开可读</em></h3>';
 Object.keys(MAT).forEach(function(k){
  h+='<div class="mrow" data-rd="'+k+'"><div><div class="mt">'+E(MAT[k].t)+'</div><div class="ms">'+E(MAT[k].sub||'')+' · '+((FULL[k]&&FULL[k].words)||0)+' 词</div></div><span class="arw">›</span></div>';});
 h+='</div>';
 h+='<div class="card"><h3>🤖 7 个 AI 陪练提示词 <em>复制即用</em></h3><div class="mini">把【今天主题】换成当天的主题。推荐用豆包 App 的语音通话模式。</div></div>';
 PROMPTS.forEach(function(p){h+='<div class="pm"><div class="pt"><span>'+E(p[0])+'</span><button class="bt" data-cp="'+encodeURIComponent(p[1])+'">复制</button></div><pre>'+E(p[1])+'</pre></div>';});
 h+='<div class="card"><h3>🛠 工具与备用语料</h3><div class="mini">· 逐句跟读音频：本机 edge-tts 可以生成「一句＋留白」MP3，要就跟我说<br>· BBC 6 Minute English（bbc.co.uk/learningenglish）：6 分钟一集，带完整文本＋音频＋词汇表<br>· VOA Learning English：慢速，带文本<br>· TED-Ed：短，有字幕<br>· 录音用手机自带 App，每天必须录</div></div>';
 const box=document.getElementById('matBox');box.innerHTML=h;
 box.querySelectorAll('[data-sh]').forEach(function(el){el.onclick=function(){openShadow(+el.dataset.sh);};});
 box.querySelectorAll('[data-rd]').forEach(function(el){el.onclick=function(){openRead(el.dataset.rd);};});
 box.querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){cp(decodeURIComponent(b.dataset.cp));};});
}

/* ================= 语块 ================= */
function renderPt(){
 let h='<div class="card"><h3>🧱 语块库 <em>'+Object.keys(CL).length+' 条</em></h3><div class="mini">每条都有中文和例句。点一下复制英文。</div><div class="inp" style="margin-top:9px"><input id="q" placeholder="搜中文或英文…"></div><div id="clBox"></div></div>';
 h+='<div class="card"><h3>💬 30 个课堂句型</h3>';
 GROUPS.forEach(function(g){h+='<div class="sg"><div class="st">'+g[0]+'</div>'+g[1].map(function(s){return '<div class="en"><span>'+E(s)+'</span><button class="bt" data-cp="'+encodeURIComponent(s)+'">复制</button></div>';}).join('')+'</div>';});
 h+='</div>';
 h+='<div class="card"><h3>🔗 20 个口语黏合剂</h3><div class="mini">说完短句接一个，断续就变连贯。</div><div class="chips" style="margin-top:8px">'+CHUNKS20.map(function(c){return '<span class="chip">'+c+'</span>';}).join('')+'</div></div>';
 const box=document.getElementById('ptBox');box.innerHTML=h;
 function cl(q){
  q=(q||'').trim().toLowerCase();let n=0,o='';
  Object.keys(CL).forEach(function(k){const c=CL[k];
   const hay=(c.en+' '+c.zh+' '+(c.ex||'')).toLowerCase();
   if(q&&hay.indexOf(q)<0)return;n++;
   o+='<div class="rec" style="box-shadow:none;border:1px solid #eef2f7;cursor:pointer" data-cp="'+encodeURIComponent(c.en)+'"><div class="rl">'+E(c.zh||'')+'</div><div style="font-weight:600">'+E(c.en)+'</div>'+(c.ex?'<div class="mini" style="margin-top:3px">'+E(c.ex)+'</div>':'')+'</div>';});
  return n?o:'<div class="mini">没找到，换个词试试。</div>';
 }
 const cb=document.getElementById('clBox');
 function paintCl(){cb.innerHTML=cl(document.getElementById('q').value);
  cb.querySelectorAll('[data-cp]').forEach(function(e){e.onclick=function(){cp(decodeURIComponent(e.dataset.cp));};});}
 paintCl();
 document.getElementById('q').oninput=paintCl;
}

/* ================= 记录 ================= */
function renderRec(){
 const n=todayN();
 let h='<div class="card"><h3>📝 卡壳清单 <em>'+ST.chunks.length+' 条</em></h3><div class="mini">记「想说但说不出来」的中文，配上正确英文。30 天会收敛到 30 条以内——那就是你真缺的全部。</div><div class="inp" style="margin-top:9px"><input id="cZh" placeholder="我想说的中文"><input id="cEn" placeholder="英文说法" style="max-width:38%"></div><button class="bt solid" id="cAdd" style="width:100%;padding:9px;font-size:12.5px">＋ 记一条</button></div>';
 if(ST.chunks.length){
  h+='<div class="card"><h3>已记录 <em>点一下复制</em></h3>';
  ST.chunks.slice().reverse().forEach(function(c,i){
   h+='<div class="rec" data-cp="'+encodeURIComponent(c.en)+'"><div class="rl">'+E(c.date)+'</div><div>'+E(c.zh)+'</div><div class="re">'+E(c.en)+'</div></div>';});
  h+='</div>';
 }
 h+='<div class="card"><h3>⭐ 今天的录音自评 <em>1–5 分</em></h3><div class="mini">① 流利度（卡壳几次）② 结构（有没有 Point→Reason→Example→So what）③ 词汇缺口（卡壳新增几条）④ 救场（用没用上救场句）</div><div id="selfBox" style="margin-top:8px"></div></div>';
 h+='<div class="card"><h3>✍️ 想改什么，直接告诉我</h3><div class="mini">这个 App 我可以随时改。比如：某天主题换掉、加内容、加倒计时、要跟读 MP3。点下面按钮复制一段话发我。</div><div class="chips" style="margin-top:8px"><span class="chip" data-cp="'+encodeURIComponent('【开口30 反馈】我想改的地方：1） 2） 3）。另外我还想要：')+'">复制反馈模板</span></div></div>';
 const box=document.getElementById('recBox');box.innerHTML=h;
 document.getElementById('cAdd').onclick=function(){
  const zh=document.getElementById('cZh').value.trim(),en=document.getElementById('cEn').value.trim();
  if(!zh){toast('先写中文');return;}
  const dd=new Date();ST.chunks.push({zh:zh,en:en||'（待补）',date:(dd.getMonth()+1)+'/'+dd.getDate()});
  save();renderRec();head();toast('已记录');
 };
 let sh='';
 for(let i=1;i<=4;i++){const v=ST.self[n+'_'+i]||0;
  sh+='<div class="mrow" style="cursor:default"><span style="flex:1;font-size:12.5px">'+['流利度','结构','词汇缺口','救场'][i-1]+'</span>';
  for(let k=1;k<=5;k++)sh+='<button class="bt'+(v===k?' solid':'')+'" data-s="'+i+'-'+k+'">'+k+'</button>';
  sh+='</div>';}
 document.getElementById('selfBox').innerHTML=sh;
 document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){const a=b.dataset.s.split('-');ST.self[n+'_'+a[0]]=+a[1];save();renderRec();};});
 document.querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){cp(decodeURIComponent(b.dataset.cp));};});
}

/* ================= 启动 ================= */
renderMat();renderPt();renderToday();renderCal();renderRec();head();
</script>
</body>
</html>
