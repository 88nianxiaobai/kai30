<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>开口 30 · 30天英语开口计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef2f7;color:#1a2233;overflow-x:hidden}
.phone{width:100%;min-height:100vh;background:#f6f8fb;display:flex;flex-direction:column;position:relative}
@media(min-width:521px){body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.phone{width:414px;height:840px;min-height:0;border-radius:32px;overflow:hidden;box-shadow:0 18px 60px rgba(20,40,80,.22);border:1px solid #d6dee9}}
header{background:linear-gradient(135deg,#1f6feb,#12b3a8);color:#fff;padding:16px 18px 13px;flex-shrink:0}
header .t{font-size:18px;font-weight:700}
header .s{font-size:11.5px;opacity:.9;margin-top:3px}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .35s;width:0}
.bar-txt{font-size:11px;opacity:.92;margin-top:5px;text-align:right}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:13px 13px 84px}
.pane{display:none}.pane.on{display:block}
nav{position:absolute;left:0;right:0;bottom:0;height:62px;background:#fff;display:flex;border-top:1px solid #e3e9f2}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#8695ab;cursor:pointer}
nav a b{font-size:18px;font-weight:400;line-height:1}
nav a.on{color:#1f6feb;font-weight:600}
.card{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px rgba(20,40,80,.055)}
.card h3{font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 em{font-style:normal;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:#eaf1fd;color:#1f6feb;flex-shrink:0}
.hero{background:linear-gradient(135deg,#1f6feb,#12b3a8);color:#fff;border-radius:16px;padding:15px;margin-bottom:11px}
.hero .k{font-size:11px;opacity:.88}.hero .n{font-size:25px;font-weight:700;margin:1px 0 3px}
.hero .th{font-size:14.5px;font-weight:600;line-height:1.4}
.task{background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 2px 8px rgba(20,40,80,.05);cursor:pointer}
.task:active{transform:scale(.985)}
.task.done{background:#f2fbf7}
.chk{width:21px;height:21px;border-radius:7px;border:2px solid #c6d2e2;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}
.task.done .chk{background:#12b3a8;border-color:#12b3a8}
.task .bd{flex:1;min-width:0}
.task .tt{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.task .tt s{text-decoration:none;font-size:10.5px;color:#98a6bb;font-weight:500;flex-shrink:0}
.task .ds{font-size:11.8px;color:#5d6b82;line-height:1.55;margin-top:3px;word-break:break-word}
.task .go{font-size:10.5px;color:#1f6feb;font-weight:600;margin-top:5px}
.task.done .tt{color:#0d8f86}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11px;background:#f0f4fa;color:#33445c;padding:3px 8px;border-radius:99px;line-height:1.45;cursor:pointer}
.chip:active{background:#dbe6f7}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cd{aspect-ratio:1;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 7px rgba(20,40,80,.06);cursor:pointer;border:2px solid transparent}
.cd .dn{font-size:15px;font-weight:700;color:#1f6feb}.cd .dt{font-size:9px;color:#93a1b8;margin-top:1px}
.cd.full{background:#e6f8f4;border-color:#12b3a8}.cd.full .dn{color:#0d8f86}
.cd.part{background:#fff8e8;border-color:#f0b429}
.cd.today{border-color:#1f6feb;box-shadow:0 0 0 3px rgba(31,111,235,.14)}
.wk{grid-column:1/-1;font-size:11.5px;font-weight:700;color:#8695ab;margin:13px 2px 5px}
.wk:first-child{margin-top:2px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#1f6feb;font-weight:600;margin-bottom:10px;cursor:pointer;padding:4px 0}
.sg{margin-bottom:11px}
.sg .st{font-size:12.5px;font-weight:700;color:#1f6feb;margin-bottom:5px}
.en{background:#fff;border-radius:10px;padding:8px 11px;margin-bottom:5px;font-size:13px;color:#22304a;line-height:1.5;display:flex;justify-content:space-between;gap:8px;align-items:center}
.en span{flex:1}
.bt{font-size:10.5px;color:#1f6feb;background:#eaf1fd;border:0;border-radius:8px;padding:4px 8px;cursor:pointer;flex-shrink:0;font-weight:600;font-family:inherit}
.bt:active{background:#d8e6fc}
.bt.solid{background:#1f6feb;color:#fff}
.pm{background:#fff;border-radius:12px;padding:11px;margin-bottom:9px;box-shadow:0 2px 8px rgba(20,40,80,.05)}
.pm .pt{font-size:12.5px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pm pre{font-size:11.5px;color:#41506a;white-space:pre-wrap;line-height:1.6;font-family:inherit;background:#f7f9fc;border-radius:9px;padding:9px;margin:0}
.rec{background:#fff;border-radius:12px;padding:11px;margin-bottom:8px;font-size:12.5px;line-height:1.55;box-shadow:0 2px 8px rgba(20,40,80,.05)}
.rec .rl{font-size:10px;color:#93a1b8;margin-bottom:3px}.rec .re{color:#0d8f86;font-weight:600}
.inp{display:flex;gap:6px;margin-bottom:10px}
.inp input{flex:1;border:1px solid #d9e2ee;border-radius:10px;padding:9px 11px;font-size:12.5px;font-family:inherit;background:#fff;min-width:0}
.inp button{background:#1f6feb;color:#fff;border:0;border-radius:10px;padding:0 14px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.mini{font-size:11.5px;color:#5d6b82;line-height:1.6}
.warn{background:#fff8e8;border-left:3px solid #f0b429;border-radius:9px;padding:9px 11px;font-size:11.8px;color:#7a5b12;line-height:1.55;margin-bottom:10px}
.ok{background:#eafaf6;border-left:3px solid #12b3a8;border-radius:9px;padding:9px 11px;font-size:11.8px;color:#0a6e67;line-height:1.55;margin-bottom:10px}
.stat{display:flex;gap:8px;margin-bottom:10px}
.stat div{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(20,40,80,.05)}
.stat b{display:block;font-size:19px;color:#1f6feb}.stat s{text-decoration:none;font-size:10px;color:#8695ab}
.sent{background:#fff;border-radius:11px;padding:10px 11px;margin-bottom:7px;display:flex;gap:9px;align-items:flex-start;box-shadow:0 2px 7px rgba(20,40,80,.05);cursor:pointer}
.sent .n{font-size:10px;color:#a9b6c9;font-weight:700;width:16px;flex-shrink:0;padding-top:2px}
.sent .x{flex:1;font-size:13px;line-height:1.6;color:#22304a}
.sent.done .x{color:#0d8f86}.sent.done{background:#f2fbf7}
.rd{background:#fff;border-radius:12px;padding:13px;font-size:13px;line-height:1.75;color:#2b3a52;box-shadow:0 2px 8px rgba(20,40,80,.05);white-space:pre-wrap}
.rd h4{font-size:14px;color:#1f6feb;margin:12px 0 6px;line-height:1.4}
.steps{counter-reset:s;margin:6px 0 0}
.step{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f0f4fa;font-size:12px;color:#41506a;line-height:1.55;cursor:pointer}
.step:last-child{border-bottom:0}
.step .ck{width:18px;height:18px;border-radius:6px;border:2px solid #c6d2e2;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;margin-top:1px}
.step.done .ck{background:#12b3a8;border-color:#12b3a8}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:rgba(26,34,51,.92);color:#fff;font-size:12px;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1}
.zw{font-size:11.5px;color:#7c8aa0;margin-top:3px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef2f7;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow .mt{font-size:13px;font-weight:600}
.mrow .ms{font-size:10.5px;color:#93a1b8;margin-top:2px}
.arw{color:#c2ccdb;font-size:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="t">开口 30 <span style="font-size:11.5px;font-weight:400;opacity:.85">· 30天英语开口计划</span></div>
    <div class="s" id="hdrSub">Day 1 / 30</div>
    <div class="bar"><i id="hdrBar"></i></div>
    <div class="bar-txt" id="hdrTxt">已完成 0 / 30 天</div>
  </header>
  <main id="main">
    <section class="pane on" id="p-today"><div id="todayBox"></div></section>
    <section class="pane" id="p-cal">
      <div class="stat"><div><b id="s1">0</b><s>完成天数</s></div><div><b id="s2">0</b><s>完成任务</s></div><div><b id="s3">0</b><s>卡壳记录</s></div></div>
      <div class="mini" style="margin-bottom:11px">点任意一天看当天完整安排。绿=全部完成，黄=部分完成，蓝框=今天。</div>
      <div id="calBox" class="cal"></div>
    </section>
    <section class="pane" id="p-mat"><div id="matBox"></div></section>
    <section class="pane" id="p-pt"><div id="ptBox"></div></section>
    <section class="pane" id="p-rec"><div id="recBox"></div></section>
    <section class="pane" id="p-detail"><div id="detailBox"></div></section>
  </main>
  <nav>
    <a data-t="today" class="on"><b>▶️</b>今天</a>
    <a data-t="cal"><b>📅</b>日历</a>
    <a data-t="mat"><b>📚</b>材料</a>
    <a data-t="pt"><b>💬</b>语块</a>
    <a data-t="rec"><b>📝</b>记录</a>
  </nav>
  <div class="toast" id="toast"></div>
</div>
<script>
/* ================= 数据层：语块库 ================= */
/* 每条：en 英文 / zh 中文 / ex 例句 */
const CL = {
/* --- 自我与工作（W1） --- */
i_work_in:{en:"I work in…",zh:"我在……工作",ex:"I work in data security at a large retail platform."},
bg_in:{en:"My background is in…",zh:"我的背景是……",ex:"My background is in audit and risk management."},
based:{en:"I'm based in…",zh:"我常驻……",ex:"I'm based in Shanghai."},
what_i_do:{en:"What I do is…",zh:"我做的是……",ex:"What I do is make sure our data is handled properly."},
focus_on:{en:"My focus is on…",zh:"我专注在……",ex:"My focus is on data compliance and risk."},
been_in:{en:"I've been in this field for…",zh:"我在这一行……年",ex:"I've been in this field for about ten years."},
responsible:{en:"I'm responsible for…",zh:"我负责……",ex:"I'm responsible for the group's data security programme."},
team_handles:{en:"Our team handles…",zh:"我们团队负责……",ex:"Our team handles compliance reviews and audits."},
day_to_day:{en:"Day to day, I…",zh:"日常我……",ex:"Day to day, I review risks and work with engineers."},
main_challenge:{en:"The main challenge is…",zh:"最大的挑战是……",ex:"The main challenge is balancing speed and control."},
involves:{en:"It involves a lot of…",zh:"这涉及大量……",ex:"It involves a lot of cross-team coordination."},
means_is:{en:"What that means is…",zh:"这意味着……",ex:"What that means is we need to move early."},
started_as:{en:"I started as…",zh:"我最初是……",ex:"I started as an auditor."},
moved_into:{en:"Then I moved into…",zh:"后来我转到……",ex:"Then I moved into data security."},
switch_because:{en:"I made the switch because…",zh:"我转行是因为……",ex:"I made the switch because I wanted to fix problems earlier."},
learned_was:{en:"What I learned was…",zh:"我学到的是……",ex:"What I learned was that controls matter more than tools."},
over_time:{en:"Over time, I realized…",zh:"慢慢地我发现……",ex:"Over time, I realized data tells the story first."},
different_angle:{en:"That gave me a different angle…",zh:"这给了我不同的视角",ex:"That gave me a different angle on risk."},
decided_to:{en:"I decided to…",zh:"我决定……",ex:"I decided to do an MBA."},
reason_is:{en:"The reason is…",zh:"原因是……",ex:"The reason is I want to work across borders."},
hoping_to:{en:"I'm hoping to…",zh:"我希望……",ex:"I'm hoping to strengthen my business thinking."},
looking_for:{en:"What I'm looking for is…",zh:"我想要的是……",ex:"What I'm looking for is a broader perspective."},
not_just:{en:"It's not just about…",zh:"这不仅是……",ex:"It's not just about the degree."},
long_term:{en:"Long term, I want to…",zh:"长期我想……",ex:"Long term, I want to lead cross-border projects."},
company_i_work:{en:"The company I work for…",zh:"我所在的公司……",ex:"The company I work for is one of the largest retail platforms."},
in_business_of:{en:"We're in the business of…",zh:"我们做的是……",ex:"We're in the business of instant retail."},
changing_fast:{en:"The industry is changing fast…",zh:"这个行业变化很快",ex:"The industry is changing fast, especially with AI."},
interesting_is:{en:"What's interesting is…",zh:"有意思的是……",ex:"What's interesting is how fast regulation moves."},
compared_with5:{en:"Compared with five years ago…",zh:"跟五年前比……",ex:"Compared with five years ago, everything is data-driven now."},
key_driver:{en:"The key driver is…",zh:"关键驱动是……",ex:"The key driver is consumer expectation."},

/* --- 专业话题（W2） --- */
from_business_pov:{en:"From a business point of view…",zh:"从商业角度看",ex:"From a business point of view, a breach is a revenue problem."},
not_just_it:{en:"It's not just about IT…",zh:"这不只是 IT 的事",ex:"It's not just about IT — it's about trust."},
risk_is:{en:"The risk is…",zh:"风险在于……",ex:"The risk is losing customer trust overnight."},
at_stake:{en:"What's at stake is…",zh:"关乎的是……",ex:"What's at stake is our licence to operate."},
belongs_on:{en:"That's why it belongs on…",zh:"所以它应该上……",ex:"That's why it belongs on the management agenda."},
the_reason_is:{en:"The reason is…",zh:"原因是……",ex:"The reason is regulators now expect evidence."},
for_example:{en:"For example…",zh:"例如……",ex:"For example, we now review every new vendor."},
so_what_is:{en:"So what it means is…",zh:"所以这意味着……",ex:"So what it means is we plan earlier."},
used_to_be:{en:"It used to be seen as…",zh:"过去它被看作……",ex:"It used to be seen as a cost centre."},
now_it_is:{en:"Now it's more like…",zh:"现在更像……",ex:"Now it's more like an enabler."},
the_shift_is:{en:"The shift is…",zh:"转变在于……",ex:"The shift is from policing to partnering."},
companies_that:{en:"Companies that…",zh:"那些……的公司",ex:"Companies that invest early avoid the mess later."},
pays_off:{en:"It pays off when…",zh:"当……时就有回报",ex:"It pays off when a client audits you."},
in_long_run:{en:"In the long run…",zh:"长期来看",ex:"In the long run, trust is cheaper than fines."},
i_would_argue:{en:"I'd argue that…",zh:"我认为（正式）",ex:"I'd argue that compliance is a competitive advantage."},
strikes_me:{en:"What strikes me is…",zh:"让我印象深刻的是",ex:"What strikes me is how little companies prepare."},
implication_is:{en:"The implication is…",zh:"影响是……",ex:"The implication is we need different skills."},
that_said:{en:"That said…",zh:"话虽如此",ex:"That said, the tools are not the hard part."},
by_and_large:{en:"By and large…",zh:"总的来说",ex:"By and large, the industry is moving the right way."},
way_i_see:{en:"The way I see it…",zh:"我的看法是",ex:"The way I see it, culture eats process."},
ai_changes:{en:"AI changes what we do, not whether we do it…",zh:"AI 改变做什么，不是要不要做",ex:"AI changes what we do, not whether we do it."},
question_isnt:{en:"The question isn't whether…",zh:"问题不是是否……",ex:"The question isn't whether to use AI."},
matters_is:{en:"What matters is…",zh:"重要的是……",ex:"What matters is who is accountable."},
still_need:{en:"We still need to…",zh:"我们仍然需要……",ex:"We still need to check the output."},
the_difference:{en:"The difference is…",zh:"区别在于……",ex:"The difference is the pace of change."},
in_my_case:{en:"In my case…",zh:"就我而言",ex:"In my case, we deployed a model last year."},
lesson_was:{en:"The lesson was…",zh:"教训是……",ex:"The lesson was to involve risk early."},
since_then:{en:"Since then…",zh:"从那以后",ex:"Since then, we run a quick review first."},
to_sum_up:{en:"To sum up…",zh:"总结一下",ex:"To sum up, governance comes before speed."},
where_i_stand:{en:"That's where I stand…",zh:"这就是我的立场",ex:"That's where I stand on it."},

/* --- 案例与对比（W3） --- */
in_terms_of:{en:"In terms of…",zh:"在……方面",ex:"In terms of culture, they were far apart."},
compared_to:{en:"Compared with…",zh:"与……相比",ex:"Compared with Germany, power distance was much higher."},
dimension_stands:{en:"The dimension that stands out is…",zh:"最突出的一维是",ex:"The dimension that stands out is power distance."},
high_vs_low:{en:"High versus low…",zh:"高与低……",ex:"High versus low context explains a lot here."},
explains_why:{en:"That explains why…",zh:"这就解释了为什么",ex:"That explains why meetings felt so different."},
both_cases:{en:"Both cases show…",zh:"两个案例都显示",ex:"Both cases show culture was underestimated."},
one_failed:{en:"One failed and one worked because…",zh:"一败一成是因为",ex:"One failed and one worked because one staged the integration."},
common_is:{en:"What they have in common is…",zh:"共同点是……",ex:"What they have in common is a strong home culture."},
key_variable:{en:"So the key variable is…",zh:"所以关键变量是……",ex:"So the key variable is the pace of integration."},
if_i_were:{en:"If I were them…",zh:"如果我是他们",ex:"If I were them, I'd have kept the local team."},
takeaway:{en:"So the takeaway for me is…",zh:"所以我得到的启示是",ex:"So the takeaway for me is pace over speed."},
real_issue:{en:"I think the real issue is…",zh:"我认为真正的问题是",ex:"I think the real issue is leadership, not culture."},
on_surface:{en:"On the surface it looked like…",zh:"表面上看起来……",ex:"On the surface it looked like a price problem."},
but_underneath:{en:"But underneath…",zh:"但深层是……",ex:"But underneath, it was a governance problem."},
acquisition_failed:{en:"The acquisition failed because…",zh:"这次收购失败是因为",ex:"The acquisition failed because integration was rushed."},
with_hindsight:{en:"With hindsight…",zh:"事后看来",ex:"With hindsight, the warning signs were there."},

/* --- 提问 --- */
elaborate:{en:"Could you elaborate on that?",zh:"能详细说说吗？",ex:""},
what_mean:{en:"What do you mean by…?",zh:"你说的……是什么意思？",ex:"What do you mean by 'high context'?"},
how_practice:{en:"How does that work in practice?",zh:"这在实践中怎么运作？",ex:""},
give_example:{en:"Can you give me an example?",zh:"能举个例子吗？",ex:""},
implication_for:{en:"What's the implication for…?",zh:"这对……意味着什么？",ex:"What's the implication for our team?"},
follow_up:{en:"May I ask a follow-up?",zh:"我可以追问一下吗？",ex:""},
apply_to:{en:"How would that apply to…?",zh:"这怎么套用到……？",ex:"How would that apply to a Chinese company?"},
your_take:{en:"What's your take on…?",zh:"你怎么看……？",ex:"What's your take on the merger?"},

/* --- 救场 --- */
didnt_catch:{en:"Sorry, I didn't catch that.",zh:"抱歉，我没听清",ex:""},
slower:{en:"Could you say that again, a bit slower?",zh:"能再说一遍，慢一点吗？",ex:""},
rephrase:{en:"I'm not sure I follow — could you rephrase?",zh:"我没太跟上，能换个说法吗？",ex:""},
come_back:{en:"Could I come back to that?",zh:"我能回头再说这个吗？",ex:""},
good_question:{en:"That's a good question — let me think for a second.",zh:"好问题，让我想一下",ex:""},
how_say:{en:"How do you say… in English?",zh:"这个用英文怎么说？",ex:""},
do_you_mean:{en:"Do you mean…?",zh:"你的意思是……？",ex:""},
got_that_right:{en:"Let me make sure I got that right…",zh:"我确认一下我没理解错",ex:""},

/* --- 同意 / 反对 --- */
good_point:{en:"That's a good point.",zh:"说得好",ex:""},
add_that:{en:"I'd add that…",zh:"我补充一点",ex:"I'd add that timing matters too."},
building_on:{en:"Building on what you said…",zh:"接着你说的",ex:"Building on what you said, the local team knew the market."},
exactly_and:{en:"Exactly, and…",zh:"正是，而且……",ex:"Exactly, and that's why they kept the brand."},
even_further:{en:"I'd go even further…",zh:"我还要更进一步",ex:"I'd go even further and say leadership decided it."},
see_differently:{en:"I see it differently.",zh:"我看法不同",ex:""},
not_sure_agree:{en:"I'm not sure I agree, because…",zh:"我不太同意，因为……",ex:"I'm not sure I agree, because the numbers say otherwise."},
may_be_true:{en:"That may be true, but…",zh:"这可能是对的，但……",ex:"That may be true, but it misses the cost."},
push_back:{en:"I'd push back on that a little.",zh:"我对此有点异议",ex:""},

const FULL={"saic": {"text": "SAIC–SsangYong ｜ Opening + Market Analysis（刘志杰 · 约10分钟 · 中英对照）\n\nTOTAL PACING ｜ 总时长分配\n\nOpening + Background + Framework ≈ 1.5 min ｜ Market (main) ≈ 7 min ｜ Market Module Summary ≈ 1 min ｜ Handoff to Law ≈ 0.5 min. Total ≈ 10 min, about 1400 words.\n\n开场+背景+框架约 1.5 分钟 ｜ 市场（主体）约 7 分钟 ｜ 市场模块总结约 1 分钟 ｜ 交接法律约 0.5 分钟。合计约 10 分钟，约 1400 词。\n\n[1] OPENING ｜ 开场（0:00–0:30）\n\nGood morning, everyone. Today, our group is going to analyze a classic cross-cultural failure: the 2004 acquisition of SsangYong Motor by SAIC. Before we begin, let me state our central argument clearly — because it is the thread that runs through everything we will say today.\n\n大家早上好。今天我们组要分析一个经典的跨文化失败案例：2004 年上汽收购双龙汽车。在开始之前，请允许我先明确说出我们的核心论点——因为它是贯穿我们今天所有内容的线索。\n\nSAIC did not lose this acquisition because it failed to understand technology. It lost it because it failed to understand culture. The deal made perfect sense on paper. It collapsed in practice.\n\n上汽输掉这宗收购，不是因为它不懂技术，而是因为它没读懂文化。这笔交易在纸面上完美自洽，在现实中却土崩瓦解。\n\nAs a group, we will analyze this case from three dimensions. I will focus on the market. Zhang Shiyuan will analyze the legal dimension, and Han Wei will analyze the management dimension. Each of us will also wrap up our own section with a short summary. So let me start with the market — but first, a very quick setup.\n\n我们组将从三个方面分析这个案例。我负责市场分析，张湜媛负责法律维度的分析，韩伟负责管理维度的分析。我们每个人也会用自己的小总结收尾各自的部分。那让我先从市场开始——不过先做一点非常简短的铺垫。\n\n[2] BACKGROUND ｜ 背景（0:30–0:50）\n\nI won't spend time on the background, because the earlier group has already set the scene. In short: SsangYong, Korea's oldest SUV manufacturer, was financially weak and looking for a global partner. SAIC, China's largest state-owned automaker, wanted foreign technology, brand credibility, and international management experience. In October 2004, SAIC acquired 48.9% of SsangYong's equity — but with management control equivalent to 51% of voting rights.\n\n背景我不想多花时间，因为前面那个组已经交代过了。简单说：双龙，韩国历史最悠久的 SUV 制造商，财务疲弱，正在寻找全球合作伙伴。上汽，中国最大的国有汽车公司，想要国外技术、品牌信誉和国际管理经验。2004 年 10 月，上汽收购了双龙 48.9% 的股权——但获得了相当于 51% 投票权的管理控制权。\n\n[3] FRAMEWORK ｜ 框架（0:50–1:10）\n\nAs for our method — you've all seen these two frameworks in class, so I'll keep them to a single sentence each. Hofstede's cultural dimensions tell us where two cultures differ. The Onion Model tells us why they differ — by peeling from visible behavior down to the core assumptions that actually drive behavior. We'll use both to open up the market dimension.\n\n至于我们的方法——这两个框架大家在课上都已经见过，所以我各用一句话带过。霍夫斯泰德的文化维度告诉我们两种文化在哪些点不同。洋葱模型告诉我们它们为什么不同——从可见的行为一路剥到真正驱动行为的基本假设。我们会用这两个来剖析市场维度。\n\n[4] MARKET ANALYSIS ｜ 市场分析（主体·1:10–8:00）\n\nOK, so let me take you into the market dimension. Here, the cross-cultural analysis reveals something that pure financial analysis would miss: a fundamental misalignment of strategic goals — and, even deeper, a difference in time orientation.\n\n好，让我带大家进入市场维度。在这里，跨文化分析揭示了一个纯财务分析会忽略的问题：战略目标的根本性错位——更深一层，是时间导向的差异。\n\nFirst, let's ask the most basic question: what did each side actually want from this deal?\n\n首先，我们问一个最根本的问题：双方到底想从这宗交易里得到什么？\n\nSAIC had three objectives. First, to acquire SsangYong's advanced diesel engine and SUV technologies, so it could adapt them for the Chinese market. Second, to enhance its own international brand credibility and to learn how to manage a foreign subsidiary. Third, to use SsangYong's distribution channels to push into overseas markets — especially Southeast Asia and the Middle East.\n\n上汽有三个目标。第一，获取双龙先进的柴油发动机和 SUV 技术，以便在中国市场做适配。第二，提升自己的国际品牌信誉，学习如何管理一家海外子公司。第三，借双龙的分销渠道打入海外市场——尤其是东南亚和中东。\n\nNow, SsangYong's expectations were different. It wanted long-term investment and financial stability. It wanted to strengthen its R&D through Chinese capital. And it wanted access to the huge Chinese consumer market through SAIC's networks.\n\n而双龙的期望则不同。它想要长期投资和财务稳定。它想借中国资本增强研发能力。它还想通过上汽的网络进入庞大的中国消费市场。\n\nOn the surface, these goals look entirely complementary. One side brings capital and market access; the other side brings technology. That's exactly why the deal was promoted as a strategic partnership for mutual growth, and why 'win-win' was the slogan on the calligraphy gift presented at the signing.\n\n表面上看，这些目标完全互补。一方带来资金和市场；另一方带来技术。这正是为什么这宗交易被宣传为互利共赢的战略合作，也是为什么「双赢」会成为签约仪式上那幅书法礼物的口号。\n\nBut here is the cultural trap. The two sides had different timelines, and different measures of success, from the very first day.\n\n但文化陷阱就在这里。从第一天起，双方的时间表和成功标准就完全不同。\n\nLet me frame this with Hofstede's Long-Term Orientation dimension. SsangYong was focused on the long term — job security, brand recovery, a sustainable future. It was building for the long term. SAIC, by contrast, was focused on the short term — diesel technology, platform reuse, knowledge transfer — to accelerate its own domestic growth. It was extracting for the short term.\n\n我用霍夫斯泰德的长期导向维度来框定这一点。双龙聚焦长期——就业保障、品牌恢复、可持续的未来。它在为长期建设。而上汽则相反，聚焦短期——柴油技术、平台复用、知识转移——以加速自身国内增长。它在为短期攫取。\n\nSame deal, two completely different clocks. One side was building for the future; the other was extracting value for the present. That one difference caused every conflict that followed.\n\n同一宗交易，却是两块完全不同的表。一方在为未来建设，另一方在为当下提取价值。单单这一处差异，造成了之后所有的冲突。\n\nNow, let's peel this with the Onion Model, because the market misalignment was not really about the numbers. It was about two different assumptions about what a partnership even is.\n\n现在用洋葱模型来剥。因为市场错位其实不是数字问题，而是关于「合伙」到底是什么的两种不同假设。\n\nOn the surface, this looked like a negotiation over terms. But underneath, at the level of basic assumptions, the two sides read 'partnership' completely differently. For SAIC, the assumption was: we are the larger, stronger player; we acquire, we control, we extract value. For SsangYong, the assumption was: we are entering a marriage of equals; we contribute technology, and we expect to be respected and protected.\n\n表面上，这看起来像一场关于条款的谈判。但在底层、在基本假设层面，双方对「合伙」的解读完全不同。对上汽，假设是：我们是更大、更强的一方；我们收购、我们控制、我们提取价值。对双龙，假设是：我们进入的是一场平等的联姻；我们贡献技术，并期望被尊重、被保护。\n\nThat mismatch of core assumptions — not the negotiation itself — is what made the market alignment fragile from day one. Because if one side treats a partnership as a takeover, and the other treats it as a partnership, then every single subsequent decision gets read in two different ways.\n\n这种核心假设的错位——而不是谈判本身——让市场层面的契合从一开始就十分脆弱。因为如果一方把合伙当成吞并，另一方把它当成合伙，那么之后每一个决定都会以两种不同的方式被解读。\n\nAnd that is precisely what we see. After the acquisition, SAIC wanted rapid knowledge transfer. The Koreans, mindful of protecting their technology and their autonomy, moved slowly. What looked to SAIC like an unreasonable delay was, from the Korean side, a reasonable safeguard of a partnership they believed they had entered.\n\n而这正是我们看到的情形。收购之后，上汽想要快速的知识转移。韩国人出于保护技术和自主权的考虑，推进缓慢。在上汽看来是不合理的拖延，在韩国人看来则是对他们所相信的那场合伙的合理守护。\n\nNeither side was being 'unreasonable.' Both were acting perfectly rationally — but according to two different cultural logics. That is the market dimension seen through the lens of culture.\n\n没有哪一方是「不讲理」。双方都极其理性——只是遵循着两套不同的文化逻辑。这就是透过文化透镜看到的市场维度。\n\n[4b] MARKET MODULE SUMMARY ｜ 市场模块总结（8:00–9:00）\n\nLet me close the market section with a short summary. What does the market analysis really tell us?\n\n让我用一小段总结收尾市场部分。市场分析到底告诉了我们什么？\n\nThe market did not kill this deal — the numbers were never the real problem. What killed it was a clash of three things. First, incompatible definitions of success: the same deal, but one side measured it in long-term stability and the other in short-term extraction. Second, a mismatch of time horizons, which we captured with Hofstede's Long-Term Orientation. And third — and this is the deepest layer — two different core assumptions about what a partnership is, which we peeled out with the Onion Model: one side saw a marriage of equals, the other saw a takeover.\n\n市场并没有杀死这宗交易——数字从来不是真正的问题。真正造成失败的是三种力量的碰撞。第一，成功标准互不相容：同一宗交易，一方用长期稳定来衡量，另一方用短期攫取来衡量。第二，时间跨度的错位，我们用霍夫斯泰德的长期导向来捕捉。第三——也是最深的一层——关于「合伙」是什么的两种不同核心假设，我们用洋葱模型剥了出来：一方看到的是平等的联姻，另一方看到的是吞并。\n\nIn short: these were not economic problems. They were cultural problems wearing economic clothing. And that is my takeaway for the market dimension.\n\n简而言之：这些不是经济问题，而是披着经济外衣的文化问题。这就是我在市场维度的核心结论。\n\n[5] HANDOFF ｜ 交给法律（9:00–9:50）\n\nNow, the market was where the deal looked good but was already fragile. But it didn't stay at the level of expectations — it escalated. And that escalation happened through the legal and structural dimension, where the clash became impossible to contain.\n\n市场是这宗交易看起来很好、但其实已经脆弱的阶段。但它并没有停留在期望层面——而是升级了。这种升级发生在法律和结构维度，在那里，冲突变得无法遏制。\n\nLet me hand over to my colleague, who will walk you through the legal dimension — the control structure and the labor union. Thank you.\n\n让我把话筒交给我的同事，他会带大家看法律维度——控制权结构和工会。谢谢。\n\nTotal ≈ 1400 words, at 140–145 words/min ≈ 10 minutes.", "words": 1145}, "r3": {"text": "Hofstede's Cultural Dimensions\n\nGeert Hofstede is a social psychologist who has conducted extensive research on cultural behaviors and norms. Through that research, he and others have identified six dimensions that they argue affect the ways people from various cultures interact. The dimensions are identified and explained below. It is important to bear in mind that these dimensions are generalizations only and may not be applicable to everyone from a particular culture. However, learning about the common ways a person from a particular society might behave can be helpful in providing potential explanations of cultural misunderstandings. (1) (Intercultural tips: people tend to misunderstand or misuse Hofstede's research, claiming that Hofstede's country scores can help people understand those countries, but his dimensions can only help people understand the cultural differences among different countries.)\n\nPower Distance\n\nThis is the way people in a society relate to each other on a hierarchical scale. A culture that gives great deference to a person of authority is a High Power Distance culture, and a culture that values the equal treatment of everyone is a Low Power Distance culture. In High Power Distance cultures, \"inequality is seen as the basis of societal order\". Low Power Distance cultures, on the other hand, see inequality as sometimes necessary (think professor to student), but the more that relationships can be equalized, the better for everyone. (This dimension displays how a culture handles inequality, particularly in relation to power. In high power distance cultures, inequality and hierarchal statuses are a way of life. Low power distance cultures move in the other direction; they place a high value on the equal distribution of societal power. If only a few maintain all the power and wealth, it's viewed as unfair.)\n\nUncertainty Avoidance\n\nThis dimension reflects the degree to which a culture embraces the uncertainty of the future. (It is natural for people to avoid uncertain situations, so our cultural perceptions and expectations would seek to avoid these situations. Any situation that does not fit within one's perception of what is normal will create a degree of uncertainty. A British person may feel uncomfortable singing karaoke in front of a hundred teachers at a party, as a Japanese high school student might find it equally uncomfortable asking her teacher a question in front of the whole class.) Hofstede argues that since uncertainty can create anxiety, all societies have found coping mechanisms to deal with that anxiety. These coping mechanisms tend to fall into three categories: technology, law, and religion. Those cultures which have a high level of uncertainty avoidance tend to rely very strongly on their set rules and ways of doing things. It may be seen as an attempt to control as much of the uncertainty as possible. (An example of an item in the research tool to assess this dimension is, \"Company rules should not be broken — even when the employee thinks it is in the company's best interests\".) Those societies with a lower level of anxiety for the future (low uncertainty avoidance) may be more relaxed about the how things are done.\n\nIndividualism and Collectivism\n\nThis dimension identifies the ways in which people of a society relate to each other, in living arrangements, decision making processes and values. Some societies, such as the U.S., strongly value the individual. We value making our own personal choices about what we study, what we say, what religion we practice, and how we choose to live. This does not mean that family and communities are not important, but we are personally responsible to make decisions for ourselves that we believe best meet our own needs. There are other cultures that put much more emphasis on the group. The decisions one makes are made with the group in mind. What major you take in college may be taken because it is something that is needed in your country, for instance. In some of those cultures, shame is a concept that is learned from childhood and drives behavioral traits within the individual. \"Any Asians will do everything in their power not to show any negative emotions or feelings for fear of going against the cultural norm of collectivism. Anger, disappointment, sadness, and issues related to shame such as poor grades, relational difficulties, bankruptcy, sexual issues, and addictions remain hidden in secrecy and shame\". (This dimension focuses on the unification of culture. In individualistic cultures, the population is less tightly-knit, and there is an \"every man for himself\" mentality. People are expected to take care of themselves and their immediate family first. In collectivist cultures, importance is placed on the concept of \"we\" instead of \"I\", with closely connected groups within that population working together. Benefits for the group as a whole is the main focus, while benefits for the self stem from the group mentality.)\n\nMasculinity and Femininity\n\nThis dimension looks at the extent to which a culture supports a traditional view of masculine and feminine traits. For these purposes, masculinity refers to traits associated with assertiveness and femininity refers to traits associated with nurture. In Hofstede's words, \"In a strict sense, only behaviors directly connected with procreation (childbearing and child begetting) are 'feminine' or 'masculine.' Yet every society recognizes many other behaviors as more suitable to females or more suitable to males; these represent relatively arbitrary choices, medicated by cultural norms and traditions\". (In this dimension, a culture is measured on a scale of masculinity vs. femininity, which represents a culture's preferences for achievement, competition, and materialism vs. preferences for teamwork, harmony, and empathy. This dimension focuses on whether a culture measures personal achievement through competitive success and the need to be the best, or through caring for others and finding value in personal quality of life, doing what makes one happiest.)\n\nLong- versus Short-Term Orientation\n\nAs Hofstede developed his research, he came to the conclusion that his work was limited by the lack of inclusion of non-Western researchers. As a result, he began working with the Chinese Value Survey (DVS), an instrument developed by Michael Harris Bond in Hong Kong. Hofstede offers this definition: \"Long Term Orientation stands for the fostering of virtues oriented towards future rewards, in particular, perseverance and thrift. Its opposite pole Short Term Orientation, stands for the fostering of virtues related to the past and present, in particular, respect for tradition, preservation of 'face,' and fulfilling social obligations\". (Long-term orientated cultures will plan for the future, while short-term orientated cultures are likely to focus on short-term gains in life. In a business sense, long-term vs. short-term orientation can also play into how that business measures succeed. Short-term is putting an importance on success during a quarterly basis, with quick results being rewarded. In long-term cultures, business is about patience and playing the long game, avoiding short-term gains that lead to long-term losses.)\n\nIndulgence versus Restraint\n\nThe final dimension was added in 2010 in order to capture more recent research conducted around themes of happiness. This dimension was based in part on research conducted by Michael Minkov, a Bulgarian sociologist and creator of the extensive World Values Survey. An indulgent society is one which values the satisfaction of human needs and desires; a restrained society sees the value in curbing ones' desires and withholding pleasures to align more with societal norms. \"Indulgent cultures will tend to focus more on individual happiness and well-being, leisure time is more important, and there is greater freedom and personal control. This is in contrast with restrained cultures where positive emotions are less freely expressed and happiness, freedom, and leisure are not given the same importance\". (All cultures acknowledge that the natural human response in life is the urgent need to gratify desires. However, each culture will answer this need by either enjoying (indulgence) or controlling (restraint) those impulses. In restrained cultures, the general attitude moves towards pessimism, as stricter morals and social rules are enforced on people. This contrasts with indulgent cultures, which is prone to be more carefree, encouraging people to enjoy leisure time and take advantage of opportunities to gratify their impulses.)\n\nSource: https://www.jmu.edu/global/isss/resources/global-campus-toolkit/hofstedes-cultural-dimensions-info.shtml\n\nBelow are six charts detailing each country's cultural dimension scores (indexed 1–100) and their relative rankings. Understanding these comparative positions clarifies the cultural values that influence a nation's people, helping you better anticipate and interpret their actions. Keep in mind that these are general tendencies, not fixed traits—variation exists within every culture. Also, though Hofstede's original research is now over six decades old and more recent data may show shifting ratings, these charts still offer a practical framework for grasping cross-cultural behavioral differences.\n\nLearning to Apply the Six Cultural Dimensions Framework", "words": 1432}, "r6": {"text": "Intercultural Conflict Management\n\nStella Ting-Toomey\n\nA key question is this: Is conflict good or bad? That is, should conflict be welcomed because it provides opportunities to strengthen relationships? Or should it be avoided because it can only lead to problems for relationships and groups? Another key question is this: What is the best way to handle conflict when it arises? Should individuals talk about it directly, deal with it indirectly, or avoid it? It's not always easy to figure out the best way to deal with conflict. And what do cultures have to do with conflict? Your cultural background may influence how you answer these questions. Some cultural groups think conflict is ultimately good, and others think that it is fundamentally destructive. Let's look at these two approaches.\n\nTwo Approaches to Conflict\n\nIn many cultures, especially Western cultures, conflict is viewed as fundamentally a good thing. That is, working through conflicts constructively results in stronger, healthier, and more satisfying relationships. Similarly, groups that work through conflict can gain new information about members or about other groups, defuse more serious conflict, and increase group cohesiveness.（1）\n\nAccording to this viewpoint, individuals should be encouraged to think of creative, even far-reaching solution to conflicts. There is also value in direct confrontation, recognizing conflict and working through it in an open, productive way. In fact, many people consider conflict-free relationships to be less than healthy and potentially problematic. In this view, conflict presents opportunities to clarify issues in relationships, release tensions, and renew relationships.\n\nHowever, many cultural groups view conflict as ultimately destructive for relationships. For example, many Asian cultures, reflecting the influence of Confucianism and Taoism, and some religious groups in the United States see conflict as disturbing the peace. （2） For instance, most Amish think of conflict not as an opportunity for personal growth, but as a threat to interpersonal and community harmony. When conflict does arise, the strong spiritual value of pacifism dictates a nonresistant response- often avoidance.\n\nAlso, these groups think that when members disagree they should adhere to the consensus of the group rather than engage in conflict. In fact, members who threaten group harmony may be sanctioned. One writer gives an example of a man from the Maori culture in New Zealand who was swearing and using inappropriate language in a public meeting:\n\nA woman went up to him, laying her hand on his arm and speaking softly. He shook her off and continued. The crowd now moved back, from him as far as possible and as if by general agreement, the listeners dropped their gaze to their toes until all he could see were the tops of their heads. The speaker slowed, faltered, was reduced to silence, and then sat down.\n\nIn cultures like these, silence and avoidance may be used to manage conflict. For example, the Amish would prefer to lose face or money rather than escalate a conflict, and Amish children are instructed to turn the other cheek in any conflict situation, even if it means getting beaten up by the neighborhood bully.（3）Similarly, cultural groups influenced by Buddhist, Taoist, Confucian, and Shinto tradition also tend to avoid direct expression of feelings and verbal aggression. (The importance of silence as a communication tool and the interpretation of silence vary from culture to culture. In low-context cultures in which ideas are encoded explicitly into words, silence often is interpreted as the absence of communication. However, high-context cultures have a different attitude toward the use of silence. Perhaps the most obvious example is Japan, although other Asian countries share the Japanese attitude about silence. The Japanese believe that silence is preferable to conversation. )\n\nIndividuals from these groups also use intermediaries- friends or colleagues who act on their behalf in dealing with conflict. People who think that interpersonal conflict provides opportunities to strengthen relationships also use mediation, but mainly in formal settings.（4）  For instance, people retain lawyers to mediate disputes, hire real estate agents to negotiate commercial transactions, and engage counselors or therapists to resolve or manage interpersonal conflicts.\n\nWhat are the basic principles of nonviolence applied to interpersonal relations?  Actually, nonviolence is not the absence of conflict, and it is not a simple refusal to fight. Rather, it involves peacemaking--a difficult, and sometimes very risky, approach to interpersonal relationships. Individuals who take the peacemaking approach strongly value the other person and encourage his or her growth, attempt to de-escalate conflicts or keep them from escalating once they start, and attempt to find creative negotiation to resolve conflicts when they arise.\n\nThese two approaches to conflict resolution reflect different underlying cultural values involving identity and face saving. In the more individualistic approach that sees conflict as good, the concern is with individuals preserving their own dignity. The more communal approach espoused by both Amish and Asian cultures and by other collectivist groups is more concerned with maintaining harmony in interpersonal relationships and preserving the dignity of others. For example, in classic Chinese thought, social harmony is the goal of human society at all levels -----individual, family, village, and nation.       (763 words)\n\nCultures influence communication styles.\n\nLevine, D. R. and Adelman, M. B.\n\nCultures influence communication styles. Although this point may seem obvious, cultural styles can and do create misunderstandings in conversations among people from different cultures.\n\nFor example, consider the following conversation between an Italian and an American. The Italian made a strong political statement with which he knew his American friends would disagree. The Italian wanted to involve the American in a lively discussion. The American, rather than openly disagreeing, said, “Well, everyone is entitled to an opinion. I accept that your opinion is different from mine.” The Italian responded, “That is all you have to say about it?” In general, the American didn’t enjoy verbal conflicts over politics or anything else. The Italian actually became angry when the American refused to get involved in the discussion. He later explained to the American, “A conversation is not fun unless it becomes heated!” (1)\n\nWhat does this example say about culture and its influence on communication? Surely, there are many Americans who do get involved in verbal conflicts over politics, just as there are some Italians who would not become involved. However, the above conversation represents types of communication patterns that are related to cultural differences.\n\nDirectness and Indirectness\n\nCultural beliefs differ as to whether directness or indirectness is considered positive(2). In the mainstream American culture, the ideal form of communication includes being direct rather than indirect.  There are several expressions in English that emphasize the importance of being direct: “Get to the point! Do not beat around the bush! Let’s get down to business!” These sayings all indicate the importance of dealing directly with issues rather than avoiding them. One way to determine whether a culture favors a direct or indirect style in communication is to find out how the people in that culture express disagreement or how they say, “No”. In Japan, there are at least fifteen ways of saying, “No,” without actually saying the word. Similarly, in Japan, it would be considered rude to say directly, “I disagree with you,” or “You’re wrong”.\n\nMany Americans believed that “honesty is the best policy,” and their communication style reflects this. Honesty and directness in communication are strongly related. It is not a surprise, then, to find out that cultural groups misjudge each other based on different beliefs about directness and honesty in communication (3).\n\n“Ping-Pong” and “Bowling” Conversation Styles\n\nLet’s look at another example of how people’s communication patterns differ: the way people converse. Some foreigners have observed that when Americans hold a conversation, it seems like they are having a Ping-Pong game.(4) One person has the ball and then hits it to the other side of the table. The other player hits the ball back and the game continues. If one person doesn’t return the ball, then the conversation stops. Each part of the conversation follows this pattern: the greeting and the opening, the discussion of a topic, and the closing and farewell. If either person talks too much, the other may become impatient and feel the other is monopolizing the conversation. Similarly, if one person doesn’t say enough or ask enough questions to keep the conversation moving, the conversation stops.\n\nAn example of a conversation style that contrasts with the American “Ping-Pong” conversation style is formal conversation among the Japanese, which has been compared to bowling.(5) Each participant in a Japanese conversation waits politely for a turn and knows exactly when the time is right to speak. That is, they know their place in line. One’s turn depends on status, age, and the relationship to the other person. When it is time to take a turn, the person bowls carefully. The others watch politely, and do not leave their places in line or take a turn out of order. No one else speaks until the ball has reached the bowling pins. Answers to questions are carefully thought out, rather than blurted out. In Japanese conversation, long silences are tolerated. For Americans, even two or three seconds of silence can become uncomfortable. Americans do not like the feeling of “pulling teeth” in conversations.(6)\n\nThe American who is used to the “Ping-Pong” style of communication is probably going to have some difficulty with some Japanese, Americans ask too many questions and do not give the other person enough time to formulate a careful answer. The American, however, is not doing something “wrong” or insensitive on purpose. The Japanese feels that the American is pushy and overly inquisitive because of the difference in cultural conditioning.\n\nTo the American, the Japanese speaker appears passive and uninterested in the conversation. The Japanese style takes too long for the average American. The Japanese person is not doing anything “wrong” and is not less interested in conversation. People misjudged the other because neither is familiar with their culturally different conversational styles.\n\nIt is not possible or necessary to know everything about the way a cultural group communicates before having contact with that group. It can take years to understand verbal style differences. However, if you can anticipate differences in communication style, your judgments about people will be more accurate, and you will have fewer cross-cultural misunderstandings.\n\nBeyond Language: Cross-Cultural Communication, 2nd Edition. Prentice Hall, 1993.\n\nurs needs a formal request and explicit approval. Silence means nothing.", "words": 1724}, "r8": {"text": "Intercultural Team Building\n\nJeanne Bret, Christin Behfar, and Mary C. Kern\n\nHarvard Business Review Notice of Use Restrictions\n\n2009\n\nTeams whose members come from different nations and backgrounds place special demands on managers especially when a feuding team looks to the boss for help with a conflict.\n\nWhen a major international software developer needed to produce a new product, the project manager assembled a team of employees from India and the United States. From the start the team members could not agree on a delivery date for the product. Americans thought the work could be done in two to three weeks; the Indians predicted it would take two to three months. As time went on, the Indian team members proved reluctant to report setbacks in the production process, which the American team members would find out about only when work was due to be passed to them. Such conflicts, of course, may affect any team, but in this case they arose from cultural differences. As tensions mounted, conflict over delivery dates and feedback became personal, disrupting team members’ communication about even mundane issues. The project manager decided he had to intervene - with the result that both the American and the Indian team members came to rely on him for direction regarding minute operational details that the team should have been able to handle itself. The manager became so bogged down by quotidian issues that the project careened hopelessly off even the most pessimistic schedule and the team never learned to work together effectively.\n\nMulticultural teams often generate frustrating management dilemmas. Cultural differences can create substantial obstacles to effective teamwork--but these may be subtle and difficult to recognize until significant damage has already been done. As in the case above, which the manager involved told us about, managers may create more problems than they resolve by intervening. The challenge in managing multicultural teams effectively is to recognize underlying cultural causes of conflict, and to intervene in ways that both get the team back on track and empower its members to deal with future challenges themselves.\n\nThe Challenges\n\nPeople tend to assume that challenges on multicultural teams arise from differing styles of communication. But this is only one of the four categories that, according to our research can create barriers to a team’s ultimate success. These categories are direct versus indirect communication; trouble with accents and fluency; differing attitudes toward hierarchy and authority; and conflicting norms for decision making.\n\nDirect versus indirect communication. Communication in Western cultures is typically direct and explicit. The meaning is on the surface and a listener doesn't have to know much about the context or the speaker to interpret it. This is not true in many other cultures, where meaning is embedded in the way the message is presented.\n\nFor example, Western negotiators get crucial information about the other party's preferences and priorities by asking direct questions, such as \"Do you prefer option A or option B?\" In cultures that use indirect communication, negotiators may have to infer preferences and priorities from changes or the lack of them in the other party's settlement proposal in cross-cultural negotiations, the non-Westerner can understand the direct communications of the Westerner, but the Westerner has difficulty understanding the indirect communications of the non-Westerner.\n\nAn American manager who was leading a project to build an interface for a U.S. and Japanese customer-data system explained the problems her team was having this way: “In Japan, they want to talk and discuss. Then we take a break and they talk within the organization. They want to make sure that there’s harmony in the rest of the organization. One of the hardest lessons for me was when I thought they were saying yes but they just meant ‘I’m listening to you.’”\n\nThe differences between direct and indirect communication can cause serious damage to relationships when team projects run into problems. When the American manager quoted above discovered that several ﬂaws in the system would signiﬁcantly disrupt company operations, she pointed this out in an e-mail to her American boss and the Japanese team members. Her boss appreciated the direct warnings; her Japanese colleagues were embarrassed, because she had violated their norms for uncovering and discussing problems. Their reaction was to provide her with less access to the people and information she needed to monitor progress. They would probably have responded better if she had pointed out the problems indirectly – for example, by asking them what would happen if a certain part of the system was not functioning properly, even though she knew full well that it was malfunctioning and also what the implications were. As our research indicates is so often true, communication challenges create barriers to effective teamwork by reducing information sharing, creating interpersonal conﬂict, or both. In Japan, a typical response to direct confrontation is to isolate the norm violator. This American manager was isolated not just socially but also physically. She told us, “They literally put my ofﬁce in a storage room, where I had desks stacked from ﬂoor to ceiling and I was the only person there. So they totally isolated me, which was a pretty loud signal to me that I was not a part of the inside circle and that they would communicate with me only as needed.”\n\nTrouble with accents and fluency. Although the language of international business is English, misunderstandings or deep frustration may occur because of nonnative speakers' accents, lack of fluency, or problems with translation or usage. These may also influence perceptions of status or competence.\n\nFor example, a Latin American member of a multicultural consulting team lamented, “Many times I felt that because of the language difference, I didn't have the words to say some things that I was thinking. I noticed that when I went to these interviews with the U.S. guy, he would tend to lead the interviews, which was understandable but also disappointing, because we are at the same level. I had very good questions, but he would take the lead.”\n\nWhen we interviewed an American member of a U.S.- Japanese team that was assessing the potential expansion of a U.S. retail chain into Japan, she described one American teammate this way: “He was not interested in the Japanese consultants’ feedback and felt that because they weren’t as ﬂuent as he was, they weren’t intelligent enough and, therefore, could add no value.” The team member described was responsible for assessing one aspect of the feasibility of expansion into Japan. Without input from the Japanese experts, he risked overestimating opportunities and underestimating challenges.\n\nNon-ﬂuent team members may well be the most expert on the team, but their difﬁculty communicating knowledge makes it hard for the team to recognize and utilize their expertise. If teammates become frustrated or inpatient with a lack of ﬂuency, interpersonal conﬂicts can arise. Nonnative speakers may become less motivated to contribute, or anxious about their performance evaluations and future career prospects. The organization as a whole pays a greater price: Its investment in a multicultural team fails to pay off.\n\nSome teams, we learned, use language differences to resolve (rather than create) tensions. A team of U.S. and Latin American buyers was negotiating with a team from a Korean supplier. The negotiations took place in Korea, but the discussions were conducted in English. Frequently the Koreans would caucus at the table by speaking Korean. The buyers, frustrated, would respond by appearing to caucus in Spanish – though they discussed only inconsequential current events and sports, in case any of the Koreans spoke Spanish. Members of the team who didn’t speak Spanish pretended to participate, to the great amusement of their teammates. This approach proved effective: It conveyed to the Koreans in an appropriately indirect way that their caucuses in Korean were frustrating and annoying to the other side. As a result, both teams cut back on sidebar conversations.\n\nDiffering attitudes toward hierarchy and authority. A challenge inherent in multicultural teamwork is that by design, teams have a rather ﬂat structure. But team members from some cultures, in which people are treated differently according to their status in an organization, are uncomfortable on ﬂat teams. If they defer to higher- status team members, their behavior will be seen as appropriate when most of the team comes from a hierarchical culture; but they may damage their stature and credibility – and even face humiliation – if most of the team comes from an egalitarian culture.\n\nOne manager of Mexican heritage, who was working on a credit and underwriting team for a bank, told us, “In Mexican culture, you’re always supposed to be humble. So whether you understand something or not, you’re sup- posed to put it in the form of a question. You have to keep it open-ended, out of respect. I think that actually worked against me, because the Americans thought I really didn’t know what I was talking about. So it made me feel like they thought I was wavering on my answer.”\n\nWhen, as a result of differing cultural norms, team members believe they’ve been treated disrespectfully, the whole project can blow up. In another Korean-U.S. negotiation, the American members of a due diligence team were having difﬁculty getting information from their Korean counterparts, so they complained directly to higher-level Korean management, nearly wrecking the deal. The higher-level managers were offended because hierarchy is strictly adhered to in Korean organizations and culture. It should have been their own lower-level people, not the U.S. team members, who came to them with a problem. And the Korean team members were mortiﬁed that their bosses had been involved before they themselves could brief them. The crisis was resolved only when high-level U.S. managers made a trip to Korea, conveying appropriate respect for their Korean counterparts.\n\nConﬂicting norms for decision making. Cultures differ enormously when it comes to decision making–particularly, how quickly decisions should be made and how much analysis is required beforehand. Not surprisingly, U.S. managers like to make decisions very quickly and with relatively little analysis by comparison with managers from other countries.\n\nA Brazilian manager at an American company who was negotiating to buy Korean products destined for Latin America told us, “On the ﬁrst day, we agreed on three points, and on the second day, the U.S.-Spanish side wanted to start with point four. But the Korean side wanted to go back and rediscuss points one through three. My boss almost had an attack.”\n\nWhat U.S. team members learn from an experience like this is that the American way simply cannot be imposed on other cultures. Managers from other cultures may, for example, decline to share information until they understand the full scope of a project. But they have learned that they can’t simply ignore the desire of their American counterparts to make decisions quickly. What to do? The best solution seems to be to make minor concessions on process–to learn to adjust to and even respect another approach to decision making. For example, American managers have learned to keep their impatient bosses away from team meetings and give them frequent if brief updates. A comparable lesson for managers from other cultures is to be explicit about what they need saying, for example, “We have to see the big picture before we talk details.”\n\n1860", "words": 1880}, "r7": {"text": "Glocal Mindset and Intercultural Leadership for Chinese Outbound Investment Enterprises\n\nWith the acceleration of global economic integration and China’s “Going Global” strategy, an increasing number of Chinese enterprises have expanded outbound investment and overseas layout. From infrastructure construction and manufacturing to digital technology and modern services, Chinese multinational enterprises have become important participants in global industrial cooperation. However, cross-cultural differences, institutional gaps, and diversified local market demands have become core obstacles restricting the sustainable development of Chinese overseas enterprises. In this context, building a glocal mindset and cultivating professional intercultural leadership have become essential capabilities for Chinese outbound investment enterprises to resolve cultural conflicts, achieve localized operation, and gain global competitive advantages. This paper explores the connotation, practical value and cultivation strategies of glocal mindset and intercultural leadership for Chinese overseas enterprises.\n\nGlocal mindset, a combination of “global” and “local”, is the core cognitive foundation of modern international business operation. Different from the single global thinking that emphasizes unified global standards or pure local thinking that focuses only on regional adaptation, glocal mindset stresses global strategic positioning plus localized flexible adaptation. According to the theoretical framework of global mindset, it integrates intellectual capital of global business cognition, psychological capital of inclusive cultural awareness, and social capital of cross-cultural communication and coordination. For Chinese outbound investment enterprises, glocal mindset means adhering to the overall global development strategy of the enterprise while fully respecting the local cultural traditions, institutional norms, consumption habits and employment concepts of host countries. It abandons the simplistic expansion model of copying domestic management models overseas, and realizes organic integration of global resource allocation and local market embedding.\n\nIntercultural leadership is the practical capability derived from glocal mindset, referring to the ability of enterprise leaders to coordinate multicultural teams, resolve cultural conflicts, and drive localized business development in cross-border operating environments. Excellent intercultural leadership covers three core dimensions: cultural intelligence, inclusive communication and flexible decision-making. Cultural intelligence enables leaders to accurately identify cultural differences in values, work styles and communication modes between Chinese and local employees. Inclusive communication focuses on equal dialogue and mutual respect to eliminate cultural prejudice and information asymmetry. Flexible decision-making requires leaders to adjust management strategies and operational logic according to local institutional and cultural characteristics, balancing corporate global norms and local operational flexibility. For Chinese overseas enterprises, intercultural leadership is no longer a personal quality of leaders, but a core organizational capability supporting long-term overseas operation.\n\nAt present, most Chinese outbound investment enterprises face prominent cultural and leadership dilemmas in overseas operations. In the initial stage of international expansion, many Chinese enterprises rely heavily on expatriate management teams, and tend to copy domestic hierarchical management models and efficient execution mechanisms to overseas branches. This management model adapted to China’s corporate culture often conflicts with the local emphasis on individual independence, procedural standardization and autonomous office culture, leading to low team collaboration efficiency and poor employee cohesion. In addition, cultural differences in business ethics and social responsibility also bring operational risks. Some enterprises focus only on project profit and scale expansion, ignoring local community demands and cultural customs, which easily triggers local public misunderstanding and resistance, hindering the sustainable development of investment projects.\n\nThe lack of systematic intercultural leadership further amplifies operational risks. Many overseas managers of Chinese enterprises have professional business capabilities but lack cross-cultural communication and conflict resolution capabilities. They often fail to accurately grasp local cultural taboos and business etiquette, resulting in communication misunderstandings with local employees, customers and government departments. Meanwhile, insufficient local talent localization and single leadership structure make it difficult for enterprises to integrate into local industrial and ecological environments. Different from Western multinational enterprises with mature cross-cultural management systems, most Chinese outbound enterprises are in the exploratory stage of cross-cultural operation, and have not formed a standardized intercultural leadership training and management system, restricting their global competitiveness improvement.\n\nTo break through cross-cultural operational dilemmas, Chinese outbound investment enterprises must take glocal mindset as the guide to build systematic intercultural leadership capabilities. First, enterprises should reshape their strategic cognition and establish a glocal development concept. Enterprises need to abandon the traditional “scale-oriented” overseas expansion thinking and turn to “quality-oriented” localized integrated development. On the basis of unifying corporate core values and global strategic goals, they should formulate differentiated operational plans adapted to local cultural characteristics, realize the organic unity of global standardization and local customization, and truly complete the transformation from “going out” to “going in”.\n\nSecond, enterprises should strengthen the cultivation of intercultural leadership and improve managers’ comprehensive cultural capabilities. Enterprises can build a systematic training system focusing on cultural intelligence, including local cultural cognition, cross-cultural communication skills, international business etiquette and overseas risk response capabilities. Meanwhile, they should optimize the overseas talent team structure, appropriately increase the proportion of local management talents, give full play to local talents’ advantages in cultural adaptation and resource connection, and build a multicultural mixed management team. Excellent intercultural leaders should possess not only professional strategic decision-making ability, but also sincere, responsible and inclusive leadership character, so as to gain recognition from multicultural teams and local communities.\n\nThird, enterprises should optimize cross-cultural management mechanisms and build inclusive corporate overseas culture. In terms of human resource management, performance appraisal, incentive mechanisms and team management systems should be adjusted according to local cultural characteristics to avoid rigid institutional copying. In terms of external operation, enterprises should actively carry out grassroots community interaction, participate in local public welfare undertakings, respect local cultural traditions and religious customs, and establish a responsible and inclusive corporate brand image. Through internal cultural integration and external community embedding, enterprises can effectively resolve cultural conflicts and build stable cross-cultural cooperative relations.\n\nIn conclusion, glocal mindset and intercultural leadership are indispensable core competencies for Chinese outbound investment enterprises to cope with global cultural diversity and achieve sustainable overseas development. In the complex and changeable global business environment, cultural differences are no longer obstacles to enterprise development, but potential opportunities for differentiated competition and inclusive growth. By establishing a glocal thinking system that balances global strategy and local adaptation, and cultivating high-quality intercultural leadership capabilities, Chinese outbound enterprises can effectively resolve cross-cultural operational risks, integrate into local markets in depth, enhance global brand influence, and contribute more Chinese strength to global economic and trade cooperation.", "words": 1043}, "r5": {"text": "Global Mergers and Acquisitions\n\nShawn E. Quill\n\nIn today's burgeoning global marketplace, companies need a workforce equipped with intercultural management expertise and international experience in order to compete. The pressure to “go global” is now insurmountable, and many organizations are turning to the formation of global partnerships to meet the challenge of competition in their industries. As a result, the growth of global mergers has been spectacular in the last few years. A recent KPMG survey revealed that from 1998 to 1999, the value international mergers and acquisitions (M&A) activity rose 47%, to a record-breaking $798 billion. (1)\n\nYet, extraordinarily high failure rates suggest that companies are not approaching these international relationships properly. CNNfn.com reported in November 1999 that 83% of international mergers failed to increase shareholder value. Analysts frequently attribute these failures to traditional domestic explanations such as strategic and financial issues. However, these explanations have not aided corporations in achieving higher success rates.\n\nCertainly not one factor is responsible for global merger failure. Yet one of the variable national cultural differences is the most powerful and overlooked reason why global mergers fail. Without understanding the impact of culture on global mergers, businesses will continue to struggle in dealing with the obstacles raised by differences that prohibit the successful integration of two organizations. Cultural differences ought to be viewed as opportunities to enhance effectiveness, not obstacles to overcome (2). To create a synergistic organization, that values and uses cultural differences, management must employ an intercultural communication framework and develop an organizational intercultural competency.\n\nCan organizations attain cultural synergy in global mergers with the proper approach (3)? How do two companies with operations, staff, management, and roots in over 100 countries manage an integration that accounts for all of the potential pitfalls? Certainly the task is not simple.\n\nTake the example of DaimlerChrysler. The CEOs at Daimler Benz and Chrysler Corporation set out to prove that cultural barriers could be overcome in global mergers. To this end, the firms carefully planned for post-merger integration. However, recent articles in the Wall Street Journal and Business Week suggest that DaimlerChrysler underestimated the influence of culture, and due to culture clash, almost two years later is still struggling to perform as a unified global organization.\n\nOne might suspect that due to the complexity, pace, and traditional concerns of managing the merger process, even when leaders suggest that culture is a primary consideration, a systematic and comprehensive approach to dealing with culture is not employed. Yet, companies can no longer afford unsuccessful multibillion-dollar deals. If organizations desire success in today's new economy, management must initiate a paradigm shift that makes culture a high priority.\n\nIn Piero Morosini’s groundbreaking book, Managing Cultural Differences: Effective Strategy and Execution Across Cultures in Global Corporate Alliances (4),  Morosini emphasizes that misunderstood national cultural differences have been cited as the most important factors behind the high failure rate of global joint ventures (JVs) and alliances (5). The impact of culture on the global merger process is pervasive as it affects all stages of interaction.\n\nWhile it is important, this realization is not enough. It is critical to understand how culture impacts the merger process. Morosini observes that when culture is neglected during the evaluation and negotiation stages of a merger, integration fails. Furthermore, he notes that the way an organization handles the challenges posed by culture is directly correlated with the performance of the merger in the post-integration stage and can mean the difference between long-term success or failure (6).\n\nAnother nuance to understand is the distinction between organizational culture and national culture (7). While some research has been conducted on organizational culture and how it relates to mergers, little research has dealt with national culture exclusively. Usually, the distinction between the two is not even made. However, it is crucial to understand that in international mergers, no matter how strong a corporate culture is, it cannot erase the influence of the national differences that are at the core of the cultural structure of each individual.\n\nOrganizations must take concrete steps towards developing a perspective that accounts for the role of culture in the merger process. Acquiring a skill-set in intercultural management must be mastered not only by executives or merger transition teams, but also by every employee in the organization. If true integration is to occur and synergies attained, each individual, from the CEO to administrative assistants, must understand the intercultural communication process and possess the skills to communicate effectively with others from different cultures. To develop this organization-wide competency, management must implement the following things:\n\n·Intercultural training for the management and merger teams prior to considering a deal\n\n·Intercultural training for all employees during the pre-combination stage to increase cultural awareness, provide realistic expectations, and develop the necessary skills for realistic cultural empathy\n\n·International assignment experience for each member of the management team\n\n·Cultural due diligence to identify areas of differences, similarities, possible problems, and synergies\n\n·Cross-organizational teams to formulate strategies for transcending cultural barriers and attaining cultural synergy\n\n·A transition management team to facilitate the transition and provide expert guidance.\n\nThese steps will facilitate the acquisition of intercultural management expertise and provide organizations with the processes necessary to navigate a global merger to success.\n\nThe development of an organization-wide intercultural competency will not only create a more effective merger partner and enable a successful integration; it will also create a specific competitive advantage for the organization. Morosini claims that \"A company possessing the pragmatic skills to continuously coordinate resources from M&As. JVs and alliances across diverse cultural contexts can build concrete advantages in a way that is difficult to replicate by competitors.\" Global merger management skills, built through experience, become a core organizational competency. This type of advantage at a time when mergers, joint ventures, and alliances are a prerequisite for global competitiveness and effectiveness will launch a select few organizations into the elite realms of global leadership.\n\nOrganizations pressed with the overwhelming complexities of managing cross-cultural organizational transformations must quickly develop a framework for understanding and executing the global merger process. Without this framework and the infusion of an intercultural management expertise in their organizations, they will be prone to repeated failure. (1017 words)\n\nIntercultural Management Quarterly 2000\n\nShawn E. Quill is the Managing Editor of the Intercultural Management Quarterly\n\n@Copyright 2000, Intercultural Management Quarterly", "words": 1050}};
const SEGD={"1": ["Good morning, everyone.", "Today, our group is going to analyze a classic cross-cultural failure: the 2004 acquisition of SsangYong Motor by SAIC.", "Before we begin, let me state our central argument clearly — because it is the thread that runs through everything we will say today.", "SAIC did not lose this acquisition because it failed to understand technology.", "It lost it because it failed to understand culture.", "The deal made perfect sense on paper.", "It collapsed in practice.", "As a group, we will analyze this case from three dimensions.", "I will focus on the market.", "Zhang Shiyuan will analyze the legal dimension, and Han Wei will analyze the management dimension.", "Each of us will also wrap up our own section with a short summary.", "So let me start with the market — but first, a very quick setup.", "I won't spend time on the background, because the earlier group has already set the scene.", "In short: SsangYong, Korea's oldest SUV manufacturer, was financially weak and looking for a global partner.", "SAIC, China's largest state-owned automaker, wanted foreign technology, brand credibility, and international management experience.", "In October 2004, SAIC acquired 48.9% of SsangYong's equity — but with management control equivalent to 51% of voting rights."], "2": ["As for our method — you've all seen these two frameworks in class, so I'll keep them to a single sentence each.", "Hofstede's cultural dimensions tell us where two cultures differ.", "The Onion Model tells us why they differ — by peeling from visible behavior down to the core assumptions that actually drive behavior.", "We'll use both to open up the market dimension.", "OK, so let me take you into the market dimension.", "Here, the cross-cultural analysis reveals something that pure financial analysis would miss: a fundamental misalignment of strategic goals — and, even deeper, a difference in time orientation.", "First, let's ask the most basic question: what did eac
